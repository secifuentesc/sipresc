<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompts IA - La Presentación</title>
<link rel="icon" type="image/png" href="/logo.png">
<meta name="theme-color" content="#0a1628">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070f1f;
  --card:#0f1f3d;
  --card2:#122449;
  --line:rgba(255,255,255,.05);
  --text:#e8edf8;
  --muted:#7a8fb0;
  --gold:#FFCC00;
  --blue:#1e4db7;
}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 0%, rgba(30,77,183,.3), transparent 40%),
    radial-gradient(circle at 80% 100%, rgba(255,204,0,.15), transparent 40%),
    var(--bg);
}

/* APP */
.app{
  max-width:900px;
  margin:auto;
  padding:20px;
}

/* HEADER */
.header{
  margin-bottom:20px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.logo{
  font-weight:600;
  font-size:13px;
  letter-spacing:1px;
  color:var(--gold);
}

.rol{
  font-size:10px;
  background:rgba(255,204,0,.1);
  padding:4px 10px;
  border-radius:20px;
}

h1{
  font-size:22px;
  margin-bottom:12px;
}

/* SEARCH */
.search{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--card);
  color:white;
  font-size:14px;
}

/* CATEGORÍAS */
.categorias{
  display:flex;
  gap:10px;
  margin:20px 0;
  overflow:auto;
}

.cat{
  padding:8px 16px;
  border-radius:30px;
  background:var(--card);
  border:1px solid var(--line);
  font-size:12px;
  cursor:pointer;
}

.cat.active{
  background:var(--gold);
  color:black;
}

/* LISTA */
.lista{
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* CARD PRO */
.card{
  background:linear-gradient(160deg,#0f1f3d,#0a1628);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  position:relative;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.card::after{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:2px;
  background:linear-gradient(90deg,var(--blue),var(--gold));
}

/* TEXTO */
.titulo{
  font-size:16px;
  font-weight:600;
}

.desc{
  font-size:13px;
  color:var(--muted);
  margin:6px 0 14px;
}

/* BOTONES */
.actions{
  display:flex;
  gap:10px;
}

.btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}

.btn:active{
  transform:scale(.96);
}

.copy{
  background:linear-gradient(135deg, #1A428A, #1e4db7);
  color:#fff;
  box-shadow:0 4px 12px rgba(30,77,183,.35);
  transition:.2s;
}

.copy:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(30,77,183,.45);
}

.fav{
  background:var(--blue);
  color:white;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:var(--card2);
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:500px;
}

/* INPUTS */
.input-dinamico{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid var(--line);
  background:#0a1628;
  color:white;
}

.prompt-preview{
  font-size:15px;              /* antes 13 */
  line-height:1.6;
  color:#dbe7ff;               /* mucho más claro */
  margin-bottom:12px;

  display:-webkit-box;
  -webkit-line-clamp:8;
  -webkit-box-orient:vertical;
  overflow:hidden;

  cursor:text;
}

.prompt-preview.expandido{
  -webkit-line-clamp:unset;
}

.ver-mas{
  background:none;
  border:none;
  color:var(--gold);
  font-size:12px;
  cursor:pointer;
  margin-bottom:10px;
}

.var{
  background:rgba(255,204,0,.12);
  color:#FFCC00;
  padding:3px 8px;
  border-radius:8px;
  cursor:pointer;
  font-weight:500;
  border:1px solid rgba(255,204,0,.3);
  transition:.2s;
}

.var:hover{
  background:rgba(255,204,0,.25);
}

.input-inline{
  width:auto;
  min-width:80px;
  border:none;
  outline:none;
  background:rgba(255,255,255,.05);
  color:#fff;
  font-size:14px;
  border-radius:6px;
  padding:2px 6px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(5,14,29,.96);
  border-bottom:1px solid rgba(255,255,255,.07);
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:8px;
  backdrop-filter:blur(14px);
}

.topbar h1{
  font-size:12px;
  font-weight:500;
  flex:1;
}

.topbar-rol{
  font-size:9px;
  color:#FFCC00;
  background:rgba(255,204,0,.1);
  padding:3px 8px;
  border-radius:20px;
}

.topbar-logo{
  width:32px;
  height:32px;
  border-radius:10px;
  background:linear-gradient(140deg,#0f2657,#1e4db7);
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo-img-top{
  width:20px;
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER PRO -->
  <div class="header">
    <div class="header-top">
      <div class="logo">SIPRESC</div>
      <div class="rol">IA DOCENTE</div>
    </div>

    <h1>Banco de Prompts</h1>

    <input class="search" placeholder="Buscar prompt..." oninput="aplicarFiltros(this.value)">
  </div>

  <!-- CATEGORÍAS -->
  <div class="categorias" id="categorias"></div>

  <!-- LISTA -->
  <div class="lista" id="lista"></div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div id="modal-texto"></div>
  </div>
</div>

</body>

<script>

const CATEGORIAS = [
  {nombre:"Todos", activa:true},
  {nombre:"Planeaciones", activa:true},
  {nombre:"Correos", activa:true},
  {nombre:"Evaluaciones", activa:false},
  {nombre:"Actividades", activa:false},
  {nombre:"Informes", activa:false},
  {nombre:"Contenido", activa:false}
];

let prompts = [

  {
    titulo:"Planeación semanal institucional",
    desc:"Planeación completa alineada al formato del colegio",
    categoria:"Planeaciones",
    texto:`
Actúa como docente experto del Instituto Parroquial Nuestra Señora de la Presentación.

Crea una planeación semanal para:
Grado: [grado]  
Asignatura: [asignatura]  
Semana: [semana]  
Tema central: [tema]

La planeación debe incluir:

1. Indicador de desempeño (redactado en infinitivo)
2. Temas de la clase
3. Actividades principales de la clase (claras, concretas y aplicables)
4. Metodología breve
5. Recursos necesarios
6. Observación para familias (tono cercano, claro y profesional)

Condiciones:
- Lenguaje claro, organizado y de alto nivel institucional
- Sin redundancias
- Coherente con el estilo del colegio
- Actividades aplicables en aula real

Entrega todo estructurado y listo para copiar en formato institucional.
`
  },

  {
    titulo:"Planeación rápida (clase puntual)",
    desc:"Planeación breve y directa para una sola clase",
    categoria:"Planeaciones",
    texto:`
Diseña una planeación de clase para:

Grado: [grado]  
Asignatura: [asignatura]  
Tema: [tema]

Incluye:
- Indicador de desempeño (en infinitivo)
- Actividad inicial
- Desarrollo de la clase
- Actividad de cierre
- Recursos

Condiciones:
- Claro, breve y aplicable
- Enfoque práctico
- Sin teoría innecesaria
`
  },

  {
    titulo:"Correo institucional a familias",
    desc:"Mensaje claro, humano y profesional",
    categoria:"Correos",
    texto:`
Redacta un correo institucional dirigido a familias del colegio.

Contexto: [situacion]

El correo debe:
- Tener saludo formal cercano
- Ser claro, organizado y sin redundancias
- Mantener tono humano y respetuoso
- No usar lenguaje robótico
- Transmitir seguridad institucional

Debe incluir:
- Introducción clara
- Desarrollo del mensaje
- Cierre adecuado

Firma como:
Instituto Parroquial Nuestra Señora de la Presentación
`
  },

  {
    titulo:"Mensaje corto tipo WhatsApp institucional",
    desc:"Comunicación breve pero bien estructurada",
    categoria:"Correos",
    texto:`
Redacta un mensaje corto institucional para WhatsApp.

Tema: [tema]

Condiciones:
- Claro y directo
- Tono cercano pero respetuoso
- Bien redactado
- Sin emojis innecesarios
- Máximo 5 líneas

Debe sentirse humano y no como texto generado por IA.
`
  },

  {
    titulo:"Observación para boletín académico",
    desc:"Comentario profesional para estudiantes",
    categoria:"Evaluaciones",
    texto:`
Redacta una observación académica para boletín.

Estudiante: [nombre]  
Situación: [situacion]

Debe:
- Mantener tono profesional
- Ser claro y respetuoso
- Evidenciar fortalezas y aspectos a mejorar
- No ser negativo ni juzgante

Formato:
Un solo párrafo bien redactado.
`
  },

  {
    titulo:"Actividad de clase creativa",
    desc:"Diseño de actividad dinámica",
    categoria:"Actividades",
    texto:`
Diseña una actividad para clase.

Grado: [grado]  
Tema: [tema]

Debe incluir:
- Objetivo
- Descripción de la actividad
- Materiales
- Resultado esperado

Condiciones:
- Dinámica
- Participativa
- Aplicable en aula real
`
  }

];

let categoriaActiva = "Todos";
let actual = "";

function init(){
  renderCategorias();
  renderPrompts();
}

function renderCategorias(){
  document.getElementById('categorias').innerHTML = CATEGORIAS.map(c=>`

    <div class="cat ${c.nombre==categoriaActiva?'active':''} ${!c.activa?'disabled':''}"
         onclick="${c.activa ? `filtrar('${c.nombre}')` : ''}">
      ${c.nombre}
    </div>

  `).join('');
}

function renderPrompts(lista = prompts){

  const cont = document.getElementById('lista');

  cont.innerHTML = lista.map((p,i)=>`

    <div class="card">

      <div class="titulo">${p.titulo}</div>
      <div class="desc">${p.desc}</div>

      <div class="prompt-preview" id="prev-${i}">
        ${formatearPrompt(p.texto)}
      </div>

      <button class="ver-mas" onclick="togglePrompt(${i})">Ver más</button>

      <div class="actions">
        <button class="btn copy" onclick="copiarPrompt(${i})">Copiar</button>
      </div>

    </div>

  `).join('');
}

function copiar(i){
  navigator.clipboard.writeText(prompts[i].texto);
  alert("Copiado");
}

function ver(i){

  const prompt = prompts[i].texto;

  const campos = [...prompt.matchAll(/\[(.*?)\]/g)].map(m => m[1]);

  let html = `
    <div style="font-weight:600;font-size:15px;margin-bottom:12px">
      Personaliza el prompt
    </div>
  `;

  campos.forEach(c=>{
    html += `
      <div style="margin-bottom:8px">
        <label style="font-size:11px;color:var(--muted)">${c}</label>
        <input class="input-dinamico" placeholder="Escribe ${c}" data-key="${c}">
      </div>
    `;
  });

  html += `
    <button class="btn copy" style="margin-top:10px" onclick="generarPreview()">Generar</button>

    <div class="preview" id="preview" style="margin-top:12px;background:#0f1f3d;padding:12px;border-radius:10px;border:1px solid var(--border)"></div>

    <button class="btn fav" style="margin-top:10px" onclick="copiarPreview()">Copiar prompt final</button>
  `;

  document.getElementById('modal-texto').innerHTML = html;
  document.getElementById('modal').style.display='flex';

  window.promptBase = prompt;
}

function copiarActual(){
  navigator.clipboard.writeText(actual);
  alert("Copiado");
}

function buscar(txt){
  let lista = prompts.filter(p =>
    p.titulo.toLowerCase().includes(txt.toLowerCase())
  );

  if(categoriaActiva !== "Todos"){
    lista = lista.filter(p=>p.categoria === categoriaActiva);
  }

  renderPrompts(lista);
}

function filtrar(cat){
  categoriaActiva = cat;
  renderCategorias();
  aplicarFiltros();
}

document.getElementById('modal').onclick = ()=> {
  document.getElementById('modal').style.display='none';
};

init();

function aplicarFiltros(texto=""){
  let lista = prompts;

  if(categoriaActiva !== "Todos"){
    lista = lista.filter(p=>p.categoria === categoriaActiva);
  }

  if(texto){
    lista = lista.filter(p =>
      p.titulo.toLowerCase().includes(texto.toLowerCase())
    );
  }

  renderPrompts(lista);
}

function copiarDinamico(){

  let resultado = window.promptBase;

  const inputs = document.querySelectorAll('.input-dinamico');

  inputs.forEach(inp=>{
    const key = inp.getAttribute('data-key');
    const val = inp.value || `[${key}]`;
    resultado = resultado.replace(`[${key}]`, val);
  });

  navigator.clipboard.writeText(resultado);

  document.getElementById('preview').innerText = resultado;
}

function generarPreview(){

  let resultado = window.promptBase;

  const inputs = document.querySelectorAll('.input-dinamico');

  inputs.forEach(inp=>{
    const key = inp.getAttribute('data-key');
    const val = inp.value || `[${key}]`;
    resultado = resultado.replace(`[${key}]`, val);
  });

  document.getElementById('preview').innerText = resultado;

  window.promptFinal = resultado;
}

function copiarPreview(){
  if(!window.promptFinal){
    alert("Primero genera el prompt");
    return;
  }

  navigator.clipboard.writeText(window.promptFinal);
  alert("Prompt copiado");
}

function formatearPrompt(texto){

  return texto.replace(/\[(.*?)\]/g, (match, p1)=>{
    return `<span class="var" onclick="editarVariable(this,'${p1}')">[${p1}]</span>`;
  });

}

function editarVariable(el, key){

  // Evita crear múltiples inputs
  if(el.querySelector("input")) return;

  const valorActual = el.getAttribute("data-value") || key;

  el.innerHTML = `<input class="input-inline" value="${valorActual}" />`;

  const input = el.querySelector("input");

  input.focus();
input.select(); // 🔥 selecciona todo automáticamente

  input.onblur = () => guardarValor(el, input.value, key);
  input.onkeydown = (e)=>{
    if(e.key === "Enter"){
      input.blur();
    }
  };

}

function togglePrompt(i){

  const el = document.getElementById(`prev-${i}`);

  el.classList.toggle("expandido");

}

function copiarPrompt(i){

  let html = document.getElementById(`prev-${i}`).innerHTML;

  // reemplazar variables editadas
  const temp = document.createElement("div");
  temp.innerHTML = html;

  temp.querySelectorAll(".var").forEach(el=>{
    const val = el.getAttribute("data-value") || el.textContent;
    el.replaceWith(val);
  });

  const textoFinal = temp.innerText;

  navigator.clipboard.writeText(textoFinal);

  alert("Prompt copiado listo para usar");
}

function guardarValor(el, valor, key){

  const final = valor || key;

  el.textContent = final;
  el.setAttribute("data-value", final);

}
</script>

</body>
</html>
