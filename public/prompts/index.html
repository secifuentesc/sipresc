<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompts IA - La Presentación</title>
<link rel="icon" type="image/png" href="/logo.png">
<meta name="theme-color" content="#0a1628">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

/* VARIABLES EXACTAS DEL SISTEMA */
:root{
  --ink:#0a1628;
  --blue:#1a3a6b;
  --royal:#0f2657;
  --cobalt:#1e4db7;

  --gold:#c9962a;
  --gold2:#e8b84b;
  --gold3:rgba(201,150,42,.12);

  --s0:#050e1d;
  --s1:#0d1f3c;
  --s2:#122449;
  --s3:#182e58;

  --br:rgba(255,255,255,.07);
  --br2:rgba(255,255,255,.13);

  --tx:#e8edf8;
  --mt:#7a8fb0;

  --card:var(--s1);
  --card2:var(--s2);
  --line:var(--br);
  --muted:var(--mt);

  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
}

/* BODY */
body{
  margin:0;
  font-family:var(--sans);
  color:var(--tx);
  background:var(--s0);

  background-image:
    radial-gradient(ellipse 60% 50% at 15% 0%,rgba(26,58,107,.5) 0%,transparent 70%),
    radial-gradient(ellipse 50% 40% at 85% 100%,rgba(30,77,183,.25) 0%,transparent 70%);
}

/* APP */
.app{
  max-width:900px;
  margin:auto;
  padding:20px;
  margin-top:10px;
}

/* ───────────── TOPBAR EXACTA ───────────── */
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(5,14,29,.96);
  border-bottom:1px solid var(--br);
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:8px;
  backdrop-filter:blur(14px);
}

.topbar h1{
  font-family:var(--mono);
  font-size:12px;
  font-weight:500;
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.topbar-rol{
  font-size:9px;
  color:var(--gold);
  font-family:var(--mono);
  background:var(--gold3);
  border:1px solid rgba(201,150,42,.25);
  padding:3px 8px;
  border-radius:20px;
  letter-spacing:.5px;
  text-transform:uppercase;
}

.topbar-logo{
  width:32px;
  height:32px;
  border-radius:10px;
  background:linear-gradient(140deg,var(--royal),var(--cobalt));
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.logo-img-top{
  width:20px;
}

/* BOTÓN SALIR EXACTO */
.logout-btn{
  background:none;
  border:none;
  color:var(--mt);
  font-size:11px;
  cursor:pointer;
  padding:4px 6px;
  font-family:var(--mono);
  transition:.2s;
}

.logout-btn:hover{
  color:#fff;
}

/* HEADER */
.header{
  margin-bottom:20px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.logo{
  font-weight:600;
  font-size:13px;
  letter-spacing:1px;
  color:var(--gold);
}

.rol{
  font-size:10px;
  background:var(--gold3);
  padding:4px 10px;
  border-radius:20px;
}

/* TITULOS */
.app h1{
  font-size:24px;
  font-weight:600;
  margin-bottom:20px;
}

/* SEARCH */
.search{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--card);
  color:white;
  font-size:14px;
}

/* CATEGORÍAS */
.categorias{
  display:flex;
  gap:10px;
  margin:20px 0;
  overflow:auto;
}

.cat{
  padding:8px 16px;
  border-radius:30px;
  background:var(--card);
  border:1px solid var(--line);
  font-size:12px;
  cursor:pointer;
}

.cat.active{
  background:var(--gold);
  color:black;
}

/* LISTA */
.lista{
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* CARD */
.card{
  background:linear-gradient(160deg,#0f1f3d,#0a1628);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px 16px;
  position:relative;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.card::after{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:2px;
  background:linear-gradient(90deg,var(--blue),var(--gold));
}

/* TEXTO */
.titulo{
  font-size:16px;
  font-weight:600;
}

.desc{
  font-size:13px;
  color:var(--muted);
  margin:4px 0 6px;
}

/* BOTONES */
.actions{
  display:flex;
  gap:10px;
}

.btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}

.btn:active{
  transform:scale(.96);
}

.copy{
  background:linear-gradient(135deg,#1A428A,#1e4db7);
  color:#fff;
  box-shadow:0 4px 12px rgba(30,77,183,.35);
}

.copy:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(30,77,183,.45);
}

.fav{
  background:var(--blue);
  color:white;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:var(--card2);
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:500px;
}

/* INPUTS */
.input-dinamico{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid var(--line);
  background:#0a1628;
  color:white;
}

/* PROMPT */
.prompt-preview{
  font-size:15px;
  line-height:1.6;
  color:#dbe7ff;
  margin-top:4px;
  margin-bottom:8px;
  display:-webkit-box;
  -webkit-line-clamp:12;
  -webkit-box-orient:vertical;
  overflow:hidden;
  white-space: pre-line;
}

.prompt-preview.expandido{
  -webkit-line-clamp:unset;
}

/* BOTÓN VER MÁS */
.ver-mas{
  background:none;
  border:none;
  color:var(--gold);
  font-size:12px;
  cursor:pointer;
  margin-bottom:10px;
}

/* VARIABLES */
.var{
  background:rgba(255,204,0,.12);
  color:#FFCC00;
  padding:3px 8px;
  border-radius:8px;
  cursor:pointer;
  font-weight:500;
  border:1px solid rgba(255,204,0,.3);
}

.var:hover{
  background:rgba(255,204,0,.25);
}

.input-inline{
  min-width:80px;
  border:none;
  background:rgba(255,255,255,.05);
  color:#fff;
  font-size:14px;
  border-radius:6px;
  padding:2px 6px;
}

.cat.disabled{
  opacity:0.4;
  cursor:not-allowed;
  pointer-events:none;
}

.no-edit{
  color:#8aa0c8;
  opacity:0.6;
  cursor:default;
}

#toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg,#1A428A,#1e4db7);
  color:#fff;
  padding:10px 18px;
  border-radius:12px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  z-index:999;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
  <a href="/" class="topbar-logo">
  <img src="/logo.png" class="logo-img-top">
</a>

  <h1>SIPRESC - La Presentación</h1>

  <span class="topbar-rol" id="tp-rol">—</span>

  <button class="logout-btn" onclick="doLogout()">Salir</button>
</div>

<!-- CONTENIDO CENTRADO -->
<div class="app">

  <h1>Banco de Prompts</h1>

  <!-- CATEGORÍAS -->
  <div class="categorias" id="categorias"></div>

  <!-- LISTA -->
  <div class="lista" id="lista"></div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div id="modal-texto"></div>
  </div>
</div>

  <div id="toast">Copiado</div>

</body>

<script>

window.SIPRESC_MODULO = 'Prompts IA';

const CATEGORIAS = [
  {nombre:"Todos", activa:false},
  {nombre:"Planeaciones", activa:true},
  {nombre:"Correos", activa:false},
  {nombre:"Evaluaciones", activa:false},
  {nombre:"Actividades", activa:false},
  {nombre:"Informes", activa:false},
  {nombre:"Contenido", activa:false}
];

let prompts = [

{
  titulo:"Planeación oficial institucional",
  desc:"Formato oficial del colegio para planeaciones semanales",
  categoria:"Planeaciones",
  texto: `
Actúa como un docente experto en planeación educativa del Instituto Parroquial Nuestra Señora de la Presentación.

Tu tarea es construir una planeación de clase clara, organizada, coherente y aplicable en el aula, siguiendo estrictamente los lineamientos institucionales.

DATOS (COMPLETAR):
Planeación semana: [semana]
Grado: [grado]
Asignatura: [asignatura]
Número de clases en la semana: [numero de clases]
Tema general: [tema]

LINEAMIENTOS INSTITUCIONALES:

1. El indicador de desempeño debe estar redactado en verbo en presente con la siguiente estructura:
Presente + contenido + contexto + evidencia (opcional).

Ejemplo:
Identifica etiquetas básicas de HTML mediante ejercicios prácticos.

2. Debe existir coherencia total entre:
- Indicador
- Temas
- Actividades

3. Las actividades deben:
- Estar organizadas por clase según el número de clases indicado.
- Generar exactamente la cantidad de clases solicitadas.
- Estar enumeradas dentro de cada clase.
- Ser oraciones completas, claras y específicas.
- Tener una extensión breve, máximo una o dos líneas por actividad.
- Ser concretas y aplicables en el aula.
- Evitar frases generales como “realizar taller”.

4. ESTILO DE REDACCIÓN (MUY IMPORTANTE):
- Usar lenguaje directo y operativo.
- No usar expresiones como: “el docente…”, “los estudiantes…”, “se realiza…”, “se busca…”.
- Redactar en forma de acción concreta: explicación, identificación, análisis, aplicación, construcción.
- Enfocar cada actividad en lo que se hace en clase.

Ejemplos correctos:
Explicación de la estructura básica de HTML con ejemplos en pantalla.
Identificación de etiquetas HTML en fragmentos de código.
Creación de una página básica usando etiquetas vistas.

5. Cada clase debe incluir:
- Tema específico de la clase.
- Actividades alineadas al tema.

6. La cantidad de clases debe coincidir exactamente con el número ingresado.

7. Redacción:
- Clara, concreta y sin extensión innecesaria.
- Correcta ortografía y puntuación.
- Cada enunciado con punto final.
- No usar emojis.

ESTRUCTURA DE RESPUESTA (OBLIGATORIA):

PLANEACIÓN SEMANA:
Repetir el número de semana

GRADO:
Repetir

ASIGNATURA:
Repetir

NÚMERO DE CLASES:
Repetir

INDICADOR DE DESEMPEÑO:
Redactado correctamente según lineamientos

PLANEACIÓN POR CLASES:
Generar únicamente la cantidad de clases indicada

CLASE 1
Tema:
Actividades:

CLASE 2
Tema:
Actividades:

CLASE 3
Tema:
Actividades:

CLASE 4
Tema:
Actividades:

(Ajustar automáticamente la cantidad de clases. No agregar ni omitir clases.)

Asegúrate de que la planeación sea breve, clara, coherente y lista para aplicarse en el aula.
`
}

];
  
let categoriaActiva = "Todos";
let actual = "";

function init(){
  renderCategorias();
  renderPrompts();
}

function renderCategorias(){
  document.getElementById('categorias').innerHTML = CATEGORIAS.map(c=>`

    <div class="cat ${c.nombre==categoriaActiva?'active':''} ${!c.activa?'disabled':''}"
         onclick="${c.activa ? `filtrar('${c.nombre}')` : ''}">
      ${c.nombre}
    </div>

  `).join('');
}

function renderPrompts(lista = prompts){

  const cont = document.getElementById('lista');

  cont.innerHTML = lista.map((p,i)=>`

    <div class="card">

      <div class="titulo">${p.titulo}</div>
      <div class="desc">${p.desc}</div>

      <div class="prompt-preview" id="prev-${i}">
        ${formatearPrompt(p.texto)}
      </div>

      <button class="ver-mas" onclick="togglePrompt(${i})">Ver más</button>

      <div class="actions">
        <button class="btn copy" onclick="copiarPrompt(${i})">Copiar</button>
      </div>

    </div>

  `).join('');
}

function copiar(i){
  navigator.clipboard.writeText(prompts[i].texto);
  alert("Copiado");
}

function ver(i){

  const prompt = prompts[i].texto;

  const campos = [...prompt.matchAll(/\[(.*?)\]/g)].map(m => m[1]);

  let html = `
    <div style="font-weight:600;font-size:15px;margin-bottom:12px">
      Personaliza el prompt
    </div>
  `;

  campos.forEach(c=>{
    html += `
      <div style="margin-bottom:8px">
        <label style="font-size:11px;color:var(--muted)">${c}</label>
        <input class="input-dinamico" placeholder="Escribe ${c}" data-key="${c}">
      </div>
    `;
  });

  html += `
    <button class="btn copy" style="margin-top:10px" onclick="generarPreview()">Generar</button>

    <div class="preview" id="preview" style="margin-top:12px;background:#0f1f3d;padding:12px;border-radius:10px;border:1px solid var(--border)"></div>

    <button class="btn fav" style="margin-top:10px" onclick="copiarPreview()">Copiar prompt final</button>
  `;

  document.getElementById('modal-texto').innerHTML = html;
  document.getElementById('modal').style.display='flex';

  window.promptBase = prompt;
}

function copiarActual(){
  navigator.clipboard.writeText(actual);
  alert("Copiado");
}

function buscar(txt){
  let lista = prompts.filter(p =>
    p.titulo.toLowerCase().includes(txt.toLowerCase())
  );

  if(categoriaActiva !== "Todos"){
    lista = lista.filter(p=>p.categoria === categoriaActiva);
  }

  renderPrompts(lista);
}

function filtrar(cat){
  categoriaActiva = cat;
  renderCategorias();
  aplicarFiltros();
}

document.getElementById('modal').onclick = ()=> {
  document.getElementById('modal').style.display='none';
};

init();
document.getElementById('tp-rol').textContent = 'DOCENTE';

function aplicarFiltros(texto=""){
  let lista = prompts;

  if(categoriaActiva !== "Todos"){
    lista = lista.filter(p=>p.categoria === categoriaActiva);
  }

  if(texto){
    lista = lista.filter(p =>
      p.titulo.toLowerCase().includes(texto.toLowerCase())
    );
  }

  renderPrompts(lista);
}

function copiarDinamico(){

  let resultado = window.promptBase;

  const inputs = document.querySelectorAll('.input-dinamico');

  inputs.forEach(inp=>{
    const key = inp.getAttribute('data-key');
    const val = inp.value || `[${key}]`;
    resultado = resultado.replace(`[${key}]`, val);
  });

  navigator.clipboard.writeText(resultado);

  document.getElementById('preview').innerText = resultado;
}

function generarPreview(){

  let resultado = window.promptBase;

  const inputs = document.querySelectorAll('.input-dinamico');

  inputs.forEach(inp=>{
    const key = inp.getAttribute('data-key');
    const val = inp.value || `[${key}]`;
    resultado = resultado.replace(`[${key}]`, val);
  });

  document.getElementById('preview').innerText = resultado;

  window.promptFinal = resultado;
}

function copiarPreview(){
  if(!window.promptFinal){
    alert("Primero genera el prompt");
    return;
  }

  navigator.clipboard.writeText(window.promptFinal);
  alert("Prompt copiado");
}

function formatearPrompt(texto){

  const editables = ["semana","grado","asignatura","numero de clases","tema"];

  // 🔥 ELIMINA espacios y saltos de línea al inicio y final
  texto = texto.trim();

  return texto.replace(/\[(.*?)\]/g, (match, p1)=>{

    const key = p1.trim();

    if(editables.includes(key)){
      return `<span class="var" onclick="editarVariable(this,'${key}')">[${key}]</span>`;
    }else{
      return `<span class="no-edit">[${key}]</span>`;
    }

  });

}

function editarVariable(el, key){

  // Evita crear múltiples inputs
  if(el.querySelector("input")) return;

  const valorActual = el.getAttribute("data-value") || key;

  el.innerHTML = `<input class="input-inline" value="${valorActual}" />`;

  const input = el.querySelector("input");

  input.focus();
input.select(); // 🔥 selecciona todo automáticamente

  input.onblur = () => guardarValor(el, input.value, key);
  input.onkeydown = (e)=>{
    if(e.key === "Enter"){
      input.blur();
    }
  };

}

function togglePrompt(i){

  const el = document.getElementById(`prev-${i}`);

  el.classList.toggle("expandido");

}

function copiarPrompt(i){

  let html = document.getElementById(`prev-${i}`).innerHTML;

  // reemplazar variables editadas
  const temp = document.createElement("div");
  temp.innerHTML = html;

  temp.querySelectorAll(".var").forEach(el=>{
    const val = el.getAttribute("data-value") || el.textContent;
    el.replaceWith(val);
  });

  const textoFinal = temp.innerText;

  navigator.clipboard.writeText(textoFinal);

  showToast("Prompt copiado");
}

function guardarValor(el, valor, key){

  const final = valor || key;

  el.textContent = final;
  el.setAttribute("data-value", final);

}

function doLogout(){
  firebase.auth().signOut();
  localStorage.removeItem('lp_user');

  document.getElementById('s-app').classList.remove('on');
  document.getElementById('s-login').classList.add('on');

  document.getElementById('bnav').style.display='none';
}

function showToast(msg="Copiado"){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");

  setTimeout(()=>{
    t.classList.remove("show");
  },1500);
}

</script>

</body>
</html>
