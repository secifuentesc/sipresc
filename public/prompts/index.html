<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompts IA - La Presentación</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#0a1628;
  color:#fff;
  padding:15px;
}

h1{
  font-size:18px;
  margin-bottom:10px;
}

.search{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-bottom:10px;
  background:#122449;
  color:white;
}

.categorias{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:15px;
}

.cat{
  padding:6px 12px;
  border-radius:20px;
  background:#122449;
  font-size:12px;
  cursor:pointer;
}

.cat.active{
  background:#FFCC00;
  color:#000;
}

.card{
  background:#122449;
  padding:14px;
  border-radius:12px;
  margin-bottom:10px;
  transition:.2s;
}

.card:hover{
  transform:scale(.98);
}

.titulo{
  font-weight:600;
}

.desc{
  font-size:13px;
  opacity:.7;
  margin:5px 0 10px;
}

.actions{
  display:flex;
  gap:8px;
}

.btn{
  flex:1;
  padding:8px;
  border:none;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
}

.copy{background:#FFCC00;}
.fav{background:#1e4db7;color:white;}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#122449;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:400px;
}

.cat.disabled{
  opacity:.3;
  cursor:not-allowed;
  background:#1a2b4a;
}

</style>
</head>

<body>

<h1>Banco de Prompts IA</h1>

<input class="search" placeholder="Buscar prompt..." oninput="aplicarFiltros(this.value)">

<div class="categorias" id="categorias"></div>

<div id="lista"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div id="modal-texto"></div>
    <button class="btn copy" onclick="copiarActual()">Copiar</button>
  </div>
</div>

<script>

const CATEGORIAS = [
  {nombre:"Todos", activa:true},
  {nombre:"Planeaciones", activa:true},
  {nombre:"Correos", activa:true},
  {nombre:"Evaluaciones", activa:false},
  {nombre:"Actividades", activa:false},
  {nombre:"Informes", activa:false},
  {nombre:"Contenido", activa:false}
];

let prompts = [
  {
    titulo:"Planeación semanal",
    desc:"Planeaciones con estructura institucional",
    categoria:"Planeaciones",
    texto:"Crea una planeación semanal con indicador en infinitivo, temas y actividades claras, alineadas al plan de área..."
  },
  {
    titulo:"Correo institucional a familias",
    desc:"Comunicación clara, humana y formal",
    categoria:"Correos",
    texto:"Redacta un correo institucional dirigido a familias, con tono cercano, claro, sin redundancias, bien estructurado..."
  }
];

let categoriaActiva = "Todos";
let actual = "";

function init(){
  renderCategorias();
  renderPrompts();
}

function renderCategorias(){
  document.getElementById('categorias').innerHTML = CATEGORIAS.map(c=>`

    <div class="cat ${c.nombre==categoriaActiva?'active':''} ${!c.activa?'disabled':''}"
         onclick="${c.activa ? `filtrar('${c.nombre}')` : ''}">
      ${c.nombre}
    </div>

  `).join('');
}

function renderPrompts(lista = prompts){
  const cont = document.getElementById('lista');

  cont.innerHTML = lista.map((p,i)=>`
    <div class="card">
      <div class="titulo">${p.titulo}</div>
      <div class="desc">${p.desc}</div>

      <div class="actions">
        <button class="btn copy" onclick="copiar(${i})">Copiar</button>
        <button class="btn fav" onclick="ver(${i})">Ver</button>
      </div>
    </div>
  `).join('');
}

function copiar(i){
  navigator.clipboard.writeText(prompts[i].texto);
  alert("Copiado");
}

function ver(i){
  actual = prompts[i].texto;
  document.getElementById('modal-texto').innerText = actual;
  document.getElementById('modal').style.display='flex';
}

function copiarActual(){
  navigator.clipboard.writeText(actual);
  alert("Copiado");
}

function buscar(txt){
  let lista = prompts.filter(p =>
    p.titulo.toLowerCase().includes(txt.toLowerCase())
  );

  if(categoriaActiva !== "Todos"){
    lista = lista.filter(p=>p.categoria === categoriaActiva);
  }

  renderPrompts(lista);
}

function filtrar(cat){
  categoriaActiva = cat;
  renderCategorias();
  aplicarFiltros();
}

document.getElementById('modal').onclick = ()=> {
  document.getElementById('modal').style.display='none';
};

init();

function aplicarFiltros(texto=""){
  let lista = prompts;

  if(categoriaActiva !== "Todos"){
    lista = lista.filter(p=>p.categoria === categoriaActiva);
  }

  if(texto){
    lista = lista.filter(p =>
      p.titulo.toLowerCase().includes(texto.toLowerCase())
    );
  }

  renderPrompts(lista);
}

</script>

</body>
</html>
