<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<title>Mis planeaciones — SIPRESC</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #0a0f1a;
  --card-bg: rgba(18, 25, 45, 0.8);
  --border: rgba(255, 255, 255, 0.08);
  --border-light: rgba(255, 255, 255, 0.12);
  --text: #f0f3fa;
  --text-muted: #8a99b8;
  --gold: #c9962a;
  --gold-light: #e8b84b;
  --green: #10b981;
  --green-bg: rgba(16, 185, 129, 0.12);
  --blue: #3b82f6;
  --blue-bg: rgba(59, 130, 246, 0.12);
  --orange: #f59e0b;
  --orange-bg: rgba(245, 158, 11, 0.12);
  --gray: #64748b;
  --gray-bg: rgba(100, 116, 139, 0.12);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(10, 15, 26, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.topbar-logo {
  width: 34px;
  height: 34px;
  background: linear-gradient(140deg, #1a3a6b, #1e4db7);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.topbar-logo img { width: 20px; filter: brightness(10); }
.topbar h1 { font-size: 16px; font-weight: 600; flex: 1; color: white; }
.topbar-rol {
  font-size: 11px;
  color: var(--gold);
  background: rgba(201, 150, 42, 0.12);
  padding: 4px 12px;
  border-radius: 20px;
}
.logout-btn, .back-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 13px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
  transition: all 0.2s;
}
.logout-btn:hover, .back-btn:hover { color: white; background: rgba(255,255,255,0.05); }
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  position: fixed;
  left: 20px;
  top: 70px;
  z-index: 60;
  background: rgba(10, 15, 26, 0.9);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 40px;
  padding: 8px 16px;
  font-size: 12px;
}
@media (max-width: 640px) {
  .back-btn { top: 62px; left: 14px; padding: 6px 12px; }
  .container { padding-top: 90px; }
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 70px 20px 40px;
}
@media (max-width: 640px) { .container { padding: 80px 16px 40px; } }

.page-header { margin-bottom: 32px; }
.page-header h1 {
  font-size: 34px;
  font-weight: 700;
  background: linear-gradient(135deg, #fff, var(--gold-light));
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  letter-spacing: -0.5px;
}
.page-header p { color: var(--text-muted); font-size: 14px; margin-top: 6px; }

.segment-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.segmented {
  display: inline-flex;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 4px;
}
.seg-btn {
  padding: 8px 24px;
  font-size: 14px;
  font-weight: 600;
  background: transparent;
  border: none;
  border-radius: 10px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
}
.seg-btn.active {
  background: linear-gradient(135deg, #1e4db7, #2563eb);
  color: white;
  box-shadow: 0 4px 12px rgba(37,99,235,0.3);
}

.semanas-section { margin: 28px 0 20px; }
.semanas-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 10px;
}
.semana-btn {
  flex-shrink: 0;
  min-width: 72px;
  padding: 12px 8px;
  background: rgba(18, 25, 45, 0.7);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  color: white;
}
.semana-btn:hover {
  transform: translateY(-2px);
  border-color: var(--gold);
  background: rgba(201,150,42,0.15);
}
.semana-btn.active {
  background: linear-gradient(135deg, #1e4db7, #2563eb);
  border-color: transparent;
  box-shadow: 0 6px 14px rgba(37,99,235,0.35);
  color: white;
}
.semana-num { font-size: 20px; font-weight: 700; }
.semana-label { font-size: 10px; opacity: 0.7; margin-top: 2px; }
.semana-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  background: var(--green);
  color: white;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 20px;
}
.semana-badge.white { background: white; color: #1e4db7; }

.results-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 24px 0 18px;
  flex-wrap: wrap;
  gap: 10px;
}
.results-count { color: var(--text-muted); font-size: 13px; }
.semana-activa-badge {
  background: rgba(16,185,129,0.15);
  color: var(--green);
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 18px;
}
@media (max-width: 480px) { .cards-grid { grid-template-columns: 1fr; } }

.plan-card {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
  animation: fadeUp 0.3s ease backwards;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
.plan-card:hover {
  transform: translateY(-4px);
  border-color: var(--border-light);
  box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 14px;
}
.card-icon {
  width: 50px;
  height: 50px;
  background: rgba(255,255,255,0.06);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-icon svg { width: 26px; height: 26px; stroke: var(--gold); stroke-width: 1.5; fill: none; }
.card-chevron {
  color: var(--text-muted);
  font-size: 20px;
  transition: transform 0.2s;
}
.plan-card:hover .card-chevron {
  transform: translateX(3px);
  color: var(--gold);
}
.card-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.card-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
.card-info { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.info-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--text-muted);
}
.info-chip svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.estado-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: 600;
}
.estado-aprobada { background: var(--green-bg); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
.estado-pendiente { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
.estado-ajustes { background: var(--orange-bg); color: var(--orange); border: 1px solid rgba(245,158,11,0.3); }
.estado-no_enviada { background: var(--gray-bg); color: var(--gray); border: 1px solid rgba(100,116,139,0.3); }

.empty-card {
  text-align: center;
  padding: 48px 24px;
  background: rgba(255,255,255,0.02);
  border: 1px dashed var(--border);
  border-radius: 24px;
}
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.empty-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

.loading { display: flex; justify-content: center; align-items: center; padding: 60px; }
.spinner {
  width: 42px;
  height: 42px;
  border: 3px solid rgba(255,255,255,0.08);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(12px);
  z-index: 1000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
@media (min-width: 768px) { .modal { align-items: center; } }
.modal-content {
  max-width: 600px;
  width: 100%;
  max-height: 88vh;
  background: linear-gradient(135deg, #121d2d, #0a1020);
  border-radius: 28px 28px 0 0;
  overflow: hidden;
  animation: slideUp 0.3s ease;
}
@media (min-width: 768px) { .modal-content { border-radius: 28px; animation: zoomIn 0.2s ease; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes zoomIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-handle {
  width: 40px;
  height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  margin: 12px auto 8px;
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header-info { display: flex; gap: 14px; align-items: center; }
.modal-icon {
  width: 48px;
  height: 48px;
  background: rgba(255,255,255,0.06);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-icon svg { width: 24px; height: 24px; stroke: var(--gold); stroke-width: 1.5; fill: none; }
.modal-title { font-size: 18px; font-weight: 700; }
.modal-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.modal-close {
  background: rgba(255,255,255,0.08);
  border: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-muted);
  transition: all 0.2s;
}
.modal-close:hover { background: rgba(255,255,255,0.15); color: white; }
.modal-body { padding: 20px; overflow-y: auto; max-height: calc(88vh - 140px); }
.modal-section { margin-bottom: 22px; }
.modal-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.modal-value {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 14px;
  line-height: 1.5;
}
.modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
.modal-btn {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.modal-btn-primary { background: linear-gradient(135deg, #f59e0b, #ea580c); border: none; color: white; }
.modal-btn-primary:hover { transform: scale(1.02); box-shadow: 0 6px 16px rgba(245,158,11,0.3); }
.modal-btn-secondary { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: var(--text); }
.modal-btn-secondary:hover { background: rgba(255,255,255,0.12); }

.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1e293b;
  border: 1px solid var(--gold);
  border-radius: 40px;
  padding: 10px 22px;
  font-size: 13px;
  color: white;
  z-index: 1100;
  transition: transform 0.25s;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo" onclick="volverPanel()"><img src="/logo.png" onerror="this.style.display='none'"></div>
  <h1>SIPRESC — Mis planeaciones</h1>
  <span class="topbar-rol" id="rolVista">DOCENTE</span>
  <button class="logout-btn" onclick="cerrarSesion()">Salir</button>
</div>

<button class="back-btn" onclick="volverPanel()">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
  Volver al panel
</button>

<div class="container">
  <div class="page-header">
    <h1>Mis planeaciones</h1>
    <p>Historial de planeaciones enviadas</p>
  </div>

  <div class="segment-label">Período académico</div>
  <div class="segmented" id="periodoGroup">
    <button class="seg-btn" data-periodo="P1">P1</button>
    <button class="seg-btn" data-periodo="P2">P2</button>
    <button class="seg-btn" data-periodo="P3">P3</button>
    <button class="seg-btn" data-periodo="P4">P4</button>
  </div>

  <div class="semanas-section">
    <div class="segment-label">Semana</div>
    <div class="semanas-scroll" id="semanasContainer"></div>
  </div>

  <div class="results-header">
    <span class="results-count" id="resultadosCount">Cargando...</span>
    <span id="semanaActualBadge"></span>
  </div>

  <div class="cards-grid" id="cardsGrid">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<div class="toast" id="toastMsg">Listo</div>

<script>
// ==================================================
// CONFIGURACIÓN
// ==================================================
const API_PLN = '/api/planeaciones';
let ST = { rol: null, correo: null, docenteId: null };
let materiasRaw = [];
let planeacionesMap = new Map();
let periodoActivo = 'P2';
let semanaSeleccionada = 8;
let semanaActual = 8;

// ==================================================
// UTILS
// ==================================================
function obtenerSesion() {
  try { const data = localStorage.getItem('lp_user'); return data ? JSON.parse(data) : null; } catch { return null; }
}
function cerrarSesion() { localStorage.removeItem('lp_user'); window.location.href = '/'; }
function volverPanel() {
  const s = obtenerSesion();
  const r = String(s?.rol || '').toLowerCase();
  if (r === 'admin') window.location.href = '/dashboardadmin/';
  else if (r === 'coordinador') window.location.href = '/dashboardcoord/';
  else window.location.href = '/';
}
function calcularSemanaActual() {
  const inicio = new Date('2026-04-25T00:30:00-05:00');
  const diff = Math.floor((new Date() - inicio) / (7*24*60*60*1000));
  let semana = 5 + diff;
  semana = ((semana - 1) % 10 + 10) % 10 + 1;
  return semana;
}
function mostrarToast(msg) {
  const t = document.getElementById('toastMsg');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ==================================================
// ICONOS IGUALES AL INDEX.HTML (adaptados por materia)
// ==================================================
function iconoPorMateria(asignatura) {
  const a = asignatura.toLowerCase();
  // Íconos idénticos a los del index.html (Planeaciones, Prompts IA, Citas, Evaluaciones)
  if (a.includes('matem') || a.includes('mate')) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="3" width="16" height="18" rx="3"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg>`;
  }
  if (a.includes('españ') || a.includes('lengua') || a.includes('literatura')) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a7 7 0 017 7c0 3-1.5 5-4 6.5V17a1 1 0 01-1 1h-4a1 1 0 01-1-1v-1.5C6.5 14 5 12 5 9a7 7 0 017-7z"/><line x1="9" y1="21" x2="15" y2="21"/></svg>`;
  }
  if (a.includes('ciencia') || a.includes('biología') || a.includes('química') || a.includes('física')) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>`;
  }
  if (a.includes('historia') || a.includes('sociales') || a.includes('geografía')) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`;
  }
  if (a.includes('física') || a.includes('educación') || a.includes('deporte')) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>`;
  }
  if (a.includes('arte') || a.includes('música') || a.includes('dibujo')) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`;
  }
  if (a.includes('inglés') || a.includes('english')) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`;
  }
  if (a.includes('tecnolog') || a.includes('informática') || a.includes('sistemas')) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>`;
  }
  if (a.includes('religión') || a.includes('ética') || a.includes('valores')) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l2.5 5.5 6 .5-4.5 4 1.5 6-5.5-3-5.5 3 1.5-6-4.5-4 6-.5L12 2z"/></svg>`;
  }
  // Ícono por defecto (libro)
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 4h11l3 3v13a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1z"/><path d="M9 13h6M9 17h4M14 4v4h5"/></svg>`;
}

// ==================================================
// API
// ==================================================
async function cargarDatos() {
  const qs = new URLSearchParams({ correo: ST.correo || '' });
  const [resMaterias, resPlaneaciones] = await Promise.all([
    fetch(`${API_PLN}?accion=cargaDocente&${qs}`).then(r => r.json()),
    fetch(`${API_PLN}?accion=misPlaneacionesDocente&periodo=${periodoActivo}&${qs}`).then(r => r.json())
  ]);
  
  materiasRaw = (resMaterias.ok && resMaterias.materias) ? resMaterias.materias : [];
  planeacionesMap.clear();
  if (resPlaneaciones.ok && resPlaneaciones.data) {
    resPlaneaciones.data.forEach(p => {
      const key = `${p.asignatura}|${p.grado}`;
      planeacionesMap.set(key, p);
    });
  }
}

function getEstado(asignatura, grado) {
  const key = `${asignatura}|${grado}`;
  const p = planeacionesMap.get(key);
  if (!p) return { estado: 'no_enviada', label: 'No enviada', data: null };
  const raw = (p.estadoRevision || p.revisionCoord || '').toLowerCase();
  if (raw === 'aprobada' || raw === 'aprobado') return { estado: 'aprobada', label: 'Aprobada', data: p, id: p.planeacionId };
  if (raw.includes('ajuste')) return { estado: 'con_ajustes', label: 'Con ajustes', data: p, id: p.planeacionId };
  if (raw === 'pendiente' || raw === 'recibida' || raw === 'por revisar') 
    return { estado: 'pendiente', label: 'En revisión', data: p, id: p.planeacionId };
  return { estado: 'pendiente', label: 'En revisión', data: p, id: p.planeacionId };
}

function desglosar() {
  const cards = [];
  materiasRaw.forEach(m => {
    m.grados.forEach(g => cards.push({ asignatura: m.asignatura, grado: g }));
  });
  cards.sort((a, b) => {
    const numA = parseInt(a.grado.match(/\d+/)?.[0] || '0');
    const numB = parseInt(b.grado.match(/\d+/)?.[0] || '0');
    if (numA !== numB) return numA - numB;
    return a.grado.localeCompare(b.grado);
  });
  return cards;
}

// ==================================================
// RENDER
// ==================================================
function renderSemanas() {
  const container = document.getElementById('semanasContainer');
  const semanas = Array.from({ length: 10 }, (_, i) => i + 1);
  container.innerHTML = semanas.map(s => `
    <button class="semana-btn ${s === semanaSeleccionada ? 'active' : ''}" data-semana="${s}">
      <div class="semana-num">${s}</div>
      <div class="semana-label">Semana</div>
      ${s === semanaActual ? `<span class="semana-badge ${s === semanaSeleccionada ? 'white' : ''}">Actual</span>` : ''}
    </button>
  `).join('');
  document.querySelectorAll('.semana-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      semanaSeleccionada = parseInt(btn.dataset.semana);
      renderSemanas();
      renderCards();
    });
  });
}

function renderPeriodo() {
  const btns = document.querySelectorAll('.seg-btn');
  btns.forEach(btn => {
    if (btn.dataset.periodo === periodoActivo) btn.classList.add('active');
    else btn.classList.remove('active');
    btn.onclick = async () => {
      periodoActivo = btn.dataset.periodo;
      renderPeriodo();
      await cargarDatos();
      renderCards();
    };
  });
}

function renderCards() {
  const tarjetas = desglosar();
  const grid = document.getElementById('cardsGrid');
  document.getElementById('resultadosCount').textContent = `${tarjetas.length} materia${tarjetas.length !== 1 ? 's' : ''}`;
  document.getElementById('semanaActualBadge').innerHTML = semanaSeleccionada === semanaActual ? '<span class="semana-activa-badge">📅 Semana actual</span>' : '';
  
  if (tarjetas.length === 0) {
    grid.innerHTML = '<div class="empty-card"><div class="empty-icon">📭</div><div class="empty-title">Sin materias asignadas</div><div class="empty-sub">No tienes materias asignadas para este período</div></div>';
    return;
  }
  
  grid.innerHTML = tarjetas.map((t, idx) => {
    const e = getEstado(t.asignatura, t.grado);
    const estadoClass = `estado-${e.estado}`;
    const estadoIcon = { aprobada: '✓', pendiente: '⏳', con_ajustes: '⚠', no_enviada: '✗' }[e.estado];
    const fecha = e.data?.timestamp ? new Date(e.data.timestamp).toLocaleDateString('es-CO') : '';
    return `
      <div class="plan-card" style="animation-delay: ${idx * 0.02}s" onclick="abrirDetalle('${t.asignatura}', '${t.grado}')">
        <div class="card-header">
          <div class="card-icon">${iconoPorMateria(t.asignatura)}</div>
          <div class="card-chevron">›</div>
        </div>
        <div class="card-title">${t.asignatura}</div>
        <div class="card-sub">Semana ${semanaSeleccionada}</div>
        <div class="card-info">
          <span class="info-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>${t.grado}</span>
          ${e.estado !== 'no_enviada' && fecha ? `<span class="info-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>${fecha}</span>` : ''}
        </div>
        <div class="estado-badge ${estadoClass}"><span>${estadoIcon}</span> ${e.label}</div>
      </div>
    `;
  }).join('');
}

function abrirDetalle(asignatura, grado) {
  const e = getEstado(asignatura, grado);
  
  // Si no hay planeación, redirigir a crear
  if (e.estado === 'no_enviada') {
    window.location.href = '/planeaciones/';
    return;
  }
  
  const p = e.data;
  if (!p) return;
  
  let clasesHtml = '';
  for (let i = 1; i <= 5; i++) {
    const tema = p[`d${i}Tema`];
    const act = p[`d${i}Actividades`];
    if (!tema && !act) continue;
    clasesHtml += `<div class="modal-value" style="margin-bottom: 10px;"><strong>Clase ${i}</strong><br>${tema ? `<span style="color:var(--text-muted)">Tema:</span> ${tema}<br>` : ''}${act ? `<span style="color:var(--text-muted)">Actividades:</span> ${act}` : ''}</div>`;
  }
  
  const estadoClass = `estado-${e.estado}`;
  const modalHtml = `
    <div class="modal" id="modalPlaneacion" onclick="if(event.target===this) cerrarModal()">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-header">
          <div class="modal-header-info">
            <div class="modal-icon">${iconoPorMateria(asignatura)}</div>
            <div><div class="modal-title">${asignatura}</div><div class="modal-sub">Semana ${p.semana || semanaSeleccionada} — ${grado}</div></div>
          </div>
          <button class="modal-close" onclick="cerrarModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="modal-section"><div class="modal-label">Estado</div><div><span class="estado-badge ${estadoClass}" style="display:inline-flex">${e.label}</span></div></div>
          <div class="modal-section"><div class="modal-label">Indicador de desempeño</div><div class="modal-value">${p.indicadorSemanal || '—'}</div></div>
          <div class="modal-section"><div class="modal-label">Clases planificadas</div>${clasesHtml || '<div class="modal-value">—</div>'}</div>
          ${p.actCompDescripcion ? `<div class="modal-section"><div class="modal-label">Actividad complementaria</div><div class="modal-value">${p.actCompDescripcion}</div></div>` : ''}
          ${p.obsFamilias ? `<div class="modal-section"><div class="modal-label">Comunicación a familias</div><div class="modal-value">${p.obsFamilias}</div></div>` : ''}
          ${p.observacionCoordinacion ? `<div class="modal-section"><div class="modal-label" style="color:var(--orange)">Observación del coordinador</div><div class="modal-value" style="background:rgba(245,158,11,0.05); border-color:rgba(245,158,11,0.2); color:#fbbf24;">${p.observacionCoordinacion}</div></div>` : ''}
        </div>
        <div class="modal-footer">
          ${e.estado === 'con_ajustes' ? `<button class="modal-btn modal-btn-primary" onclick="editarPlaneacion('${p.planeacionId}')">✏️ Editar y reenviar</button>` : `<button class="modal-btn modal-btn-secondary" onclick="cerrarModal()">Cerrar</button>`}
        </div>
      </div>
    </div>
  `;
  
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.body.style.overflow = 'hidden';
}

function cerrarModal() { const m = document.getElementById('modalPlaneacion'); if (m) m.remove(); document.body.style.overflow = ''; }
function editarPlaneacion(id) { window.location.href = `/planeaciones/?editar=1&planeacionId=${id}`; }

// ==================================================
// INIT
// ==================================================
async function init() {
  const sesion = obtenerSesion();
  if (!sesion?.correo) { window.location.href = '/'; return; }
  ST = { correo: sesion.correo, rol: sesion.rol || 'docente', docenteId: sesion.docenteId };
  document.getElementById('rolVista').textContent = String(ST.rol).toUpperCase();
  semanaActual = calcularSemanaActual();
  semanaSeleccionada = 8;
  periodoActivo = 'P2';
  
  await cargarDatos();
  renderSemanas();
  renderPeriodo();
  renderCards();
}
init();
</script>
</body>
</html>
