<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<title>Mis planeaciones — SIPRESC</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #0a0f1a;
  --card-bg: rgba(18, 25, 45, 0.8);
  --border: rgba(255, 255, 255, 0.08);
  --border-light: rgba(255, 255, 255, 0.12);
  --text: #f0f3fa;
  --text-muted: #8a99b8;
  --gold: #c9962a;
  --gold-light: #e8b84b;
  --green: #10b981;
  --green-bg: rgba(16, 185, 129, 0.12);
  --blue: #3b82f6;
  --blue-bg: rgba(59, 130, 246, 0.12);
  --orange: #f59e0b;
  --orange-bg: rgba(245, 158, 11, 0.12);
  --gray: #64748b;
  --gray-bg: rgba(100, 116, 139, 0.12);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(10, 15, 26, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.topbar-logo {
  width: 34px;
  height: 34px;
  background: linear-gradient(140deg, #1a3a6b, #1e4db7);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.topbar-logo img { width: 20px; filter: brightness(10); }
.topbar h1 { font-size: 16px; font-weight: 600; flex: 1; color: white; }
.topbar-rol {
  font-size: 11px;
  color: var(--gold);
  background: rgba(201, 150, 42, 0.12);
  padding: 4px 12px;
  border-radius: 20px;
}
.logout-btn, .back-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 13px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
  transition: all 0.2s;
}
.logout-btn:hover, .back-btn:hover { color: white; background: rgba(255,255,255,0.05); }
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  position: fixed;
  left: 20px;
  top: 70px;
  z-index: 60;
  background: rgba(10, 15, 26, 0.9);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 40px;
  padding: 8px 16px;
  font-size: 12px;
}
@media (max-width: 640px) {
  .back-btn { top: 62px; left: 14px; padding: 6px 12px; }
  .container { padding-top: 90px; }
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 70px 20px 40px;
}
@media (max-width: 640px) { .container { padding: 80px 16px 40px; } }

.page-header { margin-bottom: 32px; }
.page-header h1 {
  font-size: 34px;
  font-weight: 700;
  background: linear-gradient(135deg, #fff, var(--gold-light));
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  letter-spacing: -0.5px;
}
.page-header p { color: var(--text-muted); font-size: 14px; margin-top: 6px; }

.segment-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.segmented {
  display: inline-flex;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 4px;
}
.seg-btn {
  padding: 8px 24px;
  font-size: 14px;
  font-weight: 600;
  background: transparent;
  border: none;
  border-radius: 10px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
}
.seg-btn.active {
  background: linear-gradient(135deg, #1e4db7, #2563eb);
  color: white;
  box-shadow: 0 4px 12px rgba(37,99,235,0.3);
}

.semanas-section { margin: 28px 0 20px; }
.semanas-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 10px;
}
.semana-btn {
  flex-shrink: 0;
  min-width: 72px;
  padding: 12px 8px;
  background: rgba(18, 25, 45, 0.7);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  color: white;
}
.semana-btn:hover {
  transform: translateY(-2px);
  border-color: var(--gold);
  background: rgba(201,150,42,0.15);
}
.semana-btn.active {
  background: linear-gradient(135deg, #1e4db7, #2563eb);
  border-color: transparent;
  box-shadow: 0 6px 14px rgba(37,99,235,0.35);
  color: white;
}
.semana-num { font-size: 20px; font-weight: 700; }
.semana-label { font-size: 10px; opacity: 0.7; margin-top: 2px; }
.semana-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  background: var(--green);
  color: white;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 20px;
}
.semana-badge.white { background: white; color: #1e4db7; }

.results-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 24px 0 18px;
  flex-wrap: wrap;
  gap: 10px;
}
.results-count { color: var(--text-muted); font-size: 13px; }
.semana-activa-badge {
  background: rgba(16,185,129,0.15);
  color: var(--green);
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 18px;
}
@media (max-width: 480px) { .cards-grid { grid-template-columns: 1fr; } }

.plan-card {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
  animation: fadeUp 0.3s ease backwards;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
.plan-card:hover {
  transform: translateY(-4px);
  border-color: var(--border-light);
  box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 14px;
}
.card-icon {
  width: 50px;
  height: 50px;
  background: rgba(255,255,255,0.06);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-icon svg { width: 26px; height: 26px; stroke: var(--gold); stroke-width: 1.5; fill: none; }
.card-chevron {
  color: var(--text-muted);
  font-size: 20px;
  transition: transform 0.2s;
}
.plan-card:hover .card-chevron {
  transform: translateX(3px);
  color: var(--gold);
}
.card-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.card-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
.card-info { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.info-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--text-muted);
}
.info-chip svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.estado-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: 600;
}
.estado-aprobada { background: var(--green-bg); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
.estado-pendiente { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
.estado-ajustes { background: var(--orange-bg); color: var(--orange); border: 1px solid rgba(245,158,11,0.3); }
.estado-no_enviada { background: var(--gray-bg); color: var(--gray); border: 1px solid rgba(100,116,139,0.3); }

.empty-card {
  text-align: center;
  padding: 48px 24px;
  background: rgba(255,255,255,0.02);
  border: 1px dashed var(--border);
  border-radius: 24px;
}
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.empty-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

.loading { display: flex; justify-content: center; align-items: center; padding: 60px; }
.spinner {
  width: 42px;
  height: 42px;
  border: 3px solid rgba(255,255,255,0.08);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(12px);
  z-index: 1000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
@media (min-width: 768px) { .modal { align-items: center; } }
.modal-content {
  max-width: 600px;
  width: 100%;
  max-height: 88vh;
  background: linear-gradient(135deg, #121d2d, #0a1020);
  border-radius: 28px 28px 0 0;
  overflow: hidden;
  animation: slideUp 0.3s ease;
}
@media (min-width: 768px) { .modal-content { border-radius: 28px; animation: zoomIn 0.2s ease; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes zoomIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-handle {
  width: 40px;
  height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  margin: 12px auto 8px;
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header-info { display: flex; gap: 14px; align-items: center; }
.modal-icon {
  width: 48px;
  height: 48px;
  background: rgba(255,255,255,0.06);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-icon svg { width: 24px; height: 24px; stroke: var(--gold); stroke-width: 1.5; fill: none; }
.modal-title { font-size: 18px; font-weight: 700; }
.modal-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.modal-close {
  background: rgba(255,255,255,0.08);
  border: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-muted);
  transition: all 0.2s;
}
.modal-close:hover { background: rgba(255,255,255,0.15); color: white; }
.modal-body { padding: 20px; overflow-y: auto; max-height: calc(88vh - 140px); }
.modal-section { margin-bottom: 22px; }
.modal-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.modal-value {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 14px;
  line-height: 1.5;
}
.modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
.modal-btn {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.modal-btn-primary { background: linear-gradient(135deg, #f59e0b, #ea580c); border: none; color: white; }
.modal-btn-primary:hover { transform: scale(1.02); box-shadow: 0 6px 16px rgba(245,158,11,0.3); }
.modal-btn-secondary { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: var(--text); }
.modal-btn-secondary:hover { background: rgba(255,255,255,0.12); }

.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1e293b;
  border: 1px solid var(--gold);
  border-radius: 40px;
  padding: 10px 22px;
  font-size: 13px;
  color: white;
  z-index: 1100;
  transition: transform 0.25s;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo" onclick="volverPanel()"><img src="/logo.png" onerror="this.style.display='none'"></div>
  <h1>SIPRESC — Mis planeaciones</h1>
  <span class="topbar-rol" id="rolVista">DOCENTE</span>
  <button class="logout-btn" onclick="cerrarSesion()">Salir</button>
</div>

<button class="back-btn" onclick="volverPanel()">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
  Volver al panel
</button>

<div class="container">
  <div class="page-header">
    <h1>Mis planeaciones</h1>
    <p>Historial de planeaciones enviadas</p>
  </div>

  <div class="segment-label">Período académico</div>
  <div class="segmented" id="periodoGroup">
    <button class="seg-btn" data-periodo="P1">P1</button>
    <button class="seg-btn" data-periodo="P2">P2</button>
    <button class="seg-btn" data-periodo="P3">P3</button>
    <button class="seg-btn" data-periodo="P4">P4</button>
  </div>

  <div class="semanas-section">
    <div class="segment-label">Semana</div>
    <div class="semanas-scroll" id="semanasContainer"></div>
  </div>

  <div class="results-header">
    <span class="results-count" id="resultadosCount">Cargando...</span>
    <span id="semanaActualBadge"></span>
  </div>

  <div class="cards-grid" id="cardsGrid">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<div class="toast" id="toastMsg">Listo</div>

<script>
function getEstado(asignatura, grado) {
  const asignaturaNorm = normalizar(asignatura);
  
  // Buscar planeación que coincida en asignatura y grado (ignorando A/B)
  let planeacionEncontrada = null;
  for (const [key, p] of planeacionesMap.entries()) {
    const pAsignatura = normalizar(p.asignatura);
    if (pAsignatura === asignaturaNorm && compararGrado(p.grado, grado)) {
      planeacionEncontrada = p;
      break;
    }
  }
  
  if (!planeacionEncontrada) return { estado: 'no_enviada', label: 'No enviada', data: null };
  
  const raw = (planeacionEncontrada.estadoRevision || planeacionEncontrada.revisionCoord || '').toLowerCase();
  if (raw === 'aprobada' || raw === 'aprobado') return { estado: 'aprobada', label: 'Aprobada', data: planeacionEncontrada, id: planeacionEncontrada.planeacionId };
  if (raw.includes('ajuste')) return { estado: 'con_ajustes', label: 'Con ajustes', data: planeacionEncontrada, id: planeacionEncontrada.planeacionId };
  return { estado: 'pendiente', label: 'En revisión', data: planeacionEncontrada, id: planeacionEncontrada.planeacionId };
}
</script>
</body>
</html>
