<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<title>Mis planeaciones — SIPRESC</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #0a0f1a;
  --card-bg: rgba(18, 25, 45, 0.8);
  --border: rgba(255, 255, 255, 0.08);
  --border-light: rgba(255, 255, 255, 0.12);
  --text: #f0f3fa;
  --text-muted: #8a99b8;
  --gold: #c9962a;
  --gold-light: #e8b84b;
  --green: #10b981;
  --green-bg: rgba(16, 185, 129, 0.12);
  --blue: #3b82f6;
  --blue-bg: rgba(59, 130, 246, 0.12);
  --orange: #f59e0b;
  --orange-bg: rgba(245, 158, 11, 0.12);
  --gray: #64748b;
  --gray-bg: rgba(100, 116, 139, 0.12);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  min-height: 100vh;
}

/* TOPBAR */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(10, 15, 26, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.topbar-logo {
  width: 34px;
  height: 34px;
  background: linear-gradient(140deg, #1a3a6b, #1e4db7);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.topbar-logo img { width: 20px; filter: brightness(10); }
.topbar h1 {
  font-size: 16px;
  font-weight: 600;
  flex: 1;
  color: white;
}
.topbar-rol {
  font-size: 11px;
  color: var(--gold);
  background: rgba(201, 150, 42, 0.12);
  padding: 4px 12px;
  border-radius: 20px;
}
.logout-btn, .back-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 13px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
  transition: all 0.2s;
}
.logout-btn:hover, .back-btn:hover {
  color: white;
  background: rgba(255,255,255,0.05);
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  position: fixed;
  left: 20px;
  top: 70px;
  z-index: 60;
  background: rgba(10, 15, 26, 0.9);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 40px;
  padding: 8px 16px;
  font-size: 12px;
}
@media (max-width: 640px) {
  .back-btn { top: 62px; left: 14px; padding: 6px 12px; }
  .container { padding-top: 90px; }
}

/* CONTAINER */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 70px 20px 40px;
}
@media (max-width: 640px) {
  .container { padding: 80px 16px 40px; }
}

/* HEADER */
.page-header {
  margin-bottom: 32px;
}
.page-header h1 {
  font-size: 34px;
  font-weight: 700;
  background: linear-gradient(135deg, #fff, var(--gold-light));
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  letter-spacing: -0.5px;
}
.page-header p {
  color: var(--text-muted);
  font-size: 14px;
  margin-top: 6px;
}

/* SEGMENTED CONTROL (Período) */
.segment-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.segmented {
  display: inline-flex;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 4px;
}
.seg-btn {
  padding: 8px 24px;
  font-size: 14px;
  font-weight: 600;
  background: transparent;
  border: none;
  border-radius: 10px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
}
.seg-btn.active {
  background: linear-gradient(135deg, #1e4db7, #2563eb);
  color: white;
  box-shadow: 0 4px 12px rgba(37,99,235,0.3);
}

/* SEMANAS HORIZONTAL */
.semanas-section {
  margin: 28px 0 20px;
}
.semanas-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 10px;
}
.semana-btn {
  flex-shrink: 0;
  min-width: 72px;
  padding: 12px 8px;
  background: rgba(18, 25, 45, 0.7);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  color: white;
}
.semana-btn:hover {
  transform: translateY(-2px);
  border-color: var(--gold);
  background: rgba(201,150,42,0.15);
}
.semana-btn.active {
  background: linear-gradient(135deg, #1e4db7, #2563eb);
  border-color: transparent;
  box-shadow: 0 6px 14px rgba(37,99,235,0.35);
  color: white;
}
.semana-num {
  font-size: 20px;
  font-weight: 700;
}
.semana-label {
  font-size: 10px;
  opacity: 0.7;
  margin-top: 2px;
}
.semana-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  background: var(--green);
  color: white;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 20px;
}
.semana-badge.white {
  background: white;
  color: #1e4db7;
}

/* RESULTADOS HEADER */
.results-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 24px 0 18px;
  flex-wrap: wrap;
  gap: 10px;
}
.results-count {
  color: var(--text-muted);
  font-size: 13px;
}
.semana-activa-badge {
  background: rgba(16,185,129,0.15);
  color: var(--green);
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
}

/* GRID TARJETAS */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 18px;
}
@media (max-width: 480px) {
  .cards-grid { grid-template-columns: 1fr; }
}

/* TARJETA */
.plan-card {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
  animation: fadeUp 0.4s ease backwards;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.plan-card:hover {
  transform: translateY(-4px);
  border-color: var(--border-light);
  box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 14px;
}
.card-icon {
  width: 50px;
  height: 50px;
  background: rgba(255,255,255,0.06);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
}
.card-chevron {
  color: var(--text-muted);
  font-size: 20px;
  transition: transform 0.2s;
}
.plan-card:hover .card-chevron {
  transform: translateX(3px);
  color: var(--gold);
}
.card-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}
.card-sub {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.card-info {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.info-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--text-muted);
}
.estado-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: 600;
}
.estado-aprobada { background: var(--green-bg); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
.estado-pendiente { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
.estado-ajustes { background: var(--orange-bg); color: var(--orange); border: 1px solid rgba(245,158,11,0.3); }
.estado-no_enviada { background: var(--gray-bg); color: var(--gray); border: 1px solid rgba(100,116,139,0.3); }

/* TARJETA VACÍA */
.empty-card {
  text-align: center;
  padding: 48px 24px;
  background: rgba(255,255,255,0.02);
  border: 1px dashed var(--border);
  border-radius: 24px;
}
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.empty-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

/* LOADING */
.loading { display: flex; justify-content: center; align-items: center; padding: 60px; }
.spinner {
  width: 42px;
  height: 42px;
  border: 3px solid rgba(255,255,255,0.08);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(12px);
  z-index: 1000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
@media (min-width: 768px) { .modal { align-items: center; } }
.modal-content {
  max-width: 600px;
  width: 100%;
  max-height: 88vh;
  background: linear-gradient(135deg, #121d2d, #0a1020);
  border-radius: 28px 28px 0 0;
  overflow: hidden;
  animation: slideUp 0.3s ease;
}
@media (min-width: 768px) {
  .modal-content { border-radius: 28px; animation: zoomIn 0.2s ease; }
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes zoomIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-handle {
  width: 40px;
  height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  margin: 12px auto 8px;
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header-info { display: flex; gap: 14px; align-items: center; }
.modal-icon {
  width: 48px;
  height: 48px;
  background: rgba(255,255,255,0.06);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}
.modal-title { font-size: 18px; font-weight: 700; }
.modal-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.modal-close {
  background: rgba(255,255,255,0.08);
  border: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-muted);
  transition: all 0.2s;
}
.modal-close:hover { background: rgba(255,255,255,0.15); color: white; }
.modal-body { padding: 20px; overflow-y: auto; max-height: calc(88vh - 140px); }
.modal-section { margin-bottom: 22px; }
.modal-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.modal-value {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 14px;
  line-height: 1.5;
}
.modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
.modal-btn {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.modal-btn-primary { background: linear-gradient(135deg, #f59e0b, #ea580c); border: none; color: white; }
.modal-btn-primary:hover { transform: scale(1.02); box-shadow: 0 6px 16px rgba(245,158,11,0.3); }
.modal-btn-secondary { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: var(--text); }
.modal-btn-secondary:hover { background: rgba(255,255,255,0.12); }

.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1e293b;
  border: 1px solid var(--gold);
  border-radius: 40px;
  padding: 10px 22px;
  font-size: 13px;
  color: white;
  z-index: 1100;
  transition: transform 0.25s;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo" onclick="volverPanel()"><img src="/logo.png" onerror="this.style.display='none'"></div>
  <h1>SIPRESC — Mis planeaciones</h1>
  <span class="topbar-rol" id="rolVista">DOCENTE</span>
  <button class="logout-btn" onclick="cerrarSesion()">Salir</button>
</div>

<button class="back-btn" onclick="volverPanel()">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
  Volver al panel
</button>

<div class="container">
  <div class="page-header">
    <h1>Mis planeaciones</h1>
    <p>Historial de planeaciones enviadas</p>
  </div>

  <div class="segment-label">Período académico</div>
  <div class="segmented" id="periodoGroup">
    <button class="seg-btn" data-periodo="P1">P1</button>
    <button class="seg-btn" data-periodo="P2">P2</button>
    <button class="seg-btn" data-periodo="P3">P3</button>
    <button class="seg-btn" data-periodo="P4">P4</button>
  </div>

  <div class="semanas-section">
    <div class="segment-label">Semana</div>
    <div class="semanas-scroll" id="semanasContainer"></div>
  </div>

  <div class="results-header">
    <span class="results-count" id="resultadosCount">Cargando...</span>
    <span id="semanaActualBadge"></span>
  </div>

  <div class="cards-grid" id="cardsGrid">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<div class="toast" id="toastMsg">📋 Copiado</div>

<script>
// ==================================================
// CONFIGURACIÓN
// ==================================================
const API_PLN = '/api/planeaciones';

let ST = { rol: null, correo: null, nombre: null, docenteId: null };
let materiasRaw = [];        // [{ asignatura: "Tecnología", grados: ["6°A","6°B",...] }]
let planeacionesMap = {};    // key: "asignatura|grado" -> planeacion
let periodoActivo = 'P2';
let semanaSeleccionada = 8;
let semanaActual = 8;

// ==================================================
// UTILS
// ==================================================
function obtenerSesion() {
  try { const data = localStorage.getItem('lp_user'); return data ? JSON.parse(data) : null; } catch { return null; }
}
function cerrarSesion() { localStorage.removeItem('lp_user'); window.location.href = '/'; }
function volverPanel() {
  const sesion = obtenerSesion();
  const rol = String(sesion?.rol || '').toLowerCase();
  if (rol === 'admin') window.location.href = '/dashboardadmin/';
  else if (rol === 'coordinador') window.location.href = '/dashboardcoord/';
  else window.location.href = '/';
}
function calcularSemanaActual() {
  const inicio = new Date('2026-04-25T00:30:00-05:00');
  const diff = Math.floor((new Date() - inicio) / (7*24*60*60*1000));
  let semana = 5 + diff;
  semana = ((semana - 1) % 10 + 10) % 10 + 1;
  return semana;
}
function mostrarToast(msg) {
  const t = document.getElementById('toastMsg');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ==================================================
// API
// ==================================================
async function apiCall(accion, params = {}) {
  const qs = new URLSearchParams({ accion, correo: ST.correo || '', ...params });
  const res = await fetch(`${API_PLN}?${qs}`);
  return res.json();
}

async function cargarMaterias() {
  const res = await apiCall('cargaDocente');
  if (res.ok && res.materias) {
    materiasRaw = res.materias;
  } else {
    materiasRaw = [];
  }
}

async function cargarPlaneaciones() {
  const res = await apiCall('misPlaneacionesDocente', { periodo: periodoActivo });
  planeacionesMap = {};
  if (res.ok && res.data) {
    res.data.forEach(p => {
      const key = `${p.asignatura}|${p.grado}`;
      planeacionesMap[key] = p;
    });
  }
}

// Desglosar materias en tarjetas individuales (una por cada grado)
function desglosarMaterias() {
  const tarjetas = [];
  materiasRaw.forEach(m => {
    m.grados.forEach(grado => {
      tarjetas.push({
        asignatura: m.asignatura,
        grado: grado,
        key: `${m.asignatura}|${grado}`
      });
    });
  });
  // Ordenar por grado (ej: 6°A, 6°B, 7°A, 7°B...)
  tarjetas.sort((a, b) => {
    const gradoA = a.grado.replace(/[^0-9]/g, '') || '0';
    const gradoB = b.grado.replace(/[^0-9]/g, '') || '0';
    if (gradoA !== gradoB) return parseInt(gradoA) - parseInt(gradoB);
    return a.grado.localeCompare(b.grado);
  });
  return tarjetas;
}

function getEstadoPlaneacion(asignatura, grado) {
  const key = `${asignatura}|${grado}`;
  const p = planeacionesMap[key];
  if (!p) return { estado: 'no_enviada', label: 'No enviada', planeacionId: null, data: null };
  
  const estadoRaw = (p.estadoRevision || p.revisionCoord || '').toLowerCase();
  if (estadoRaw === 'aprobada' || estadoRaw === 'aprobado') 
    return { estado: 'aprobada', label: 'Aprobada', planeacionId: p.planeacionId, data: p };
  if (estadoRaw.includes('ajuste')) 
    return { estado: 'con_ajustes', label: 'Con ajustes', planeacionId: p.planeacionId, data: p };
  return { estado: 'pendiente', label: 'En revisión', planeacionId: p.planeacionId, data: p };
}

// ==================================================
// RENDER
// ==================================================
function renderSemanas() {
  const container = document.getElementById('semanasContainer');
  const semanas = Array.from({ length: 10 }, (_, i) => i + 1);
  
  container.innerHTML = semanas.map(s => {
    const esActual = s === semanaActual;
    const activa = s === semanaSeleccionada;
    return `
      <button class="semana-btn ${activa ? 'active' : ''}" data-semana="${s}">
        <div class="semana-num">${s}</div>
        <div class="semana-label">Semana</div>
        ${esActual ? `<span class="semana-badge ${activa ? 'white' : ''}">Actual</span>` : ''}
      </button>
    `;
  }).join('');
  
  document.querySelectorAll('.semana-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      semanaSeleccionada = parseInt(btn.dataset.semana);
      renderSemanas();
      renderCards();
    });
  });
}

function renderPeriodo() {
  const btns = document.querySelectorAll('.seg-btn');
  btns.forEach(btn => {
    if (btn.dataset.periodo === periodoActivo) btn.classList.add('active');
    else btn.classList.remove('active');
    btn.onclick = async () => {
      periodoActivo = btn.dataset.periodo;
      renderPeriodo();
      await cargarPlaneaciones();
      renderCards();
    };
  });
}

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  const tarjetas = desglosarMaterias();
  
  document.getElementById('resultadosCount').textContent = `${tarjetas.length} materia${tarjetas.length !== 1 ? 's' : ''}`;
  
  if (semanaSeleccionada === semanaActual) {
    document.getElementById('semanaActualBadge').innerHTML = '<span class="semana-activa-badge">📅 Semana actual</span>';
  } else {
    document.getElementById('semanaActualBadge').innerHTML = '';
  }
  
  if (tarjetas.length === 0) {
    grid.innerHTML = '<div class="empty-card"><div class="empty-icon">📭</div><div class="empty-title">Sin materias asignadas</div><div class="empty-sub">No tienes materias asignadas para este período</div></div>';
    return;
  }
  
  grid.innerHTML = tarjetas.map((t, idx) => {
    const estadoInfo = getEstadoPlaneacion(t.asignatura, t.grado);
    const estadoClase = `estado-${estadoInfo.estado}`;
    const estadoIcon = { aprobada: '✓', pendiente: '⏳', con_ajustes: '⚠', no_enviada: '✗' }[estadoInfo.estado];
    
    return `
      <div class="plan-card" style="animation-delay: ${idx * 0.02}s" onclick="abrirPlaneacion('${t.asignatura}', '${t.grado}')">
        <div class="card-header">
          <div class="card-icon">${obtenerIcono(t.asignatura)}</div>
          <div class="card-chevron">›</div>
        </div>
        <div class="card-title">${t.asignatura}</div>
        <div class="card-sub">Semana ${semanaSeleccionada}</div>
        <div class="card-info">
          <span class="info-chip">🎓 ${t.grado}</span>
          ${estadoInfo.estado !== 'no_enviada' && estadoInfo.data?.timestamp ? `<span class="info-chip">📅 ${new Date(estadoInfo.data.timestamp).toLocaleDateString('es-CO')}</span>` : ''}
        </div>
        <div class="estado-badge ${estadoClase}">
          <span>${estadoIcon}</span> ${estadoInfo.label}
        </div>
      </div>
    `;
  }).join('');
}

function obtenerIcono(asignatura) {
  const a = asignatura.toLowerCase();
  if (a.includes('matem')) return '📐';
  if (a.includes('españ') || a.includes('lengua')) return '📖';
  if (a.includes('ciencia')) return '🔬';
  if (a.includes('historia')) return '🏛️';
  if (a.includes('física') || a.includes('educación')) return '⚽';
  if (a.includes('arte')) return '🎨';
  if (a.includes('inglés')) return '🌎';
  if (a.includes('tecnolog')) return '💻';
  if (a.includes('religión')) return '⛪';
  return '📚';
}

function abrirPlaneacion(asignatura, grado) {
  const estadoInfo = getEstadoPlaneacion(asignatura, grado);
  
  // Si no hay planeación enviada, redirigir a crear
  if (estadoInfo.estado === 'no_enviada') {
    window.location.href = '/planeaciones/';
    return;
  }
  
  const p = estadoInfo.data;
  if (!p) return;
  
  // Generar HTML de clases
  let clasesHtml = '';
  for (let i = 1; i <= 5; i++) {
    const tema = p[`d${i}Tema`];
    const act = p[`d${i}Actividades`];
    if (!tema && !act) continue;
    clasesHtml += `
      <div class="modal-value" style="margin-bottom: 10px;">
        <strong>Clase ${i}</strong><br>
        ${tema ? `<span style="color:var(--text-muted)">Tema:</span> ${tema}<br>` : ''}
        ${act ? `<span style="color:var(--text-muted)">Actividades:</span> ${act}` : ''}
      </div>
    `;
  }
  
  const estadoClase = `estado-${estadoInfo.estado}`;
  const modalHtml = `
    <div class="modal" id="modalPlaneacion" onclick="if(event.target===this) cerrarModal()">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-header">
          <div class="modal-header-info">
            <div class="modal-icon">${obtenerIcono(asignatura)}</div>
            <div>
              <div class="modal-title">${asignatura}</div>
              <div class="modal-sub">Semana ${p.semana || semanaSeleccionada} — ${grado}</div>
            </div>
          </div>
          <button class="modal-close" onclick="cerrarModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="modal-section">
            <div class="modal-label">Estado</div>
            <div><span class="estado-badge ${estadoClase}" style="display:inline-flex">${estadoInfo.label}</span></div>
          </div>
          <div class="modal-section">
            <div class="modal-label">Indicador de desempeño</div>
            <div class="modal-value">${p.indicadorSemanal || '—'}</div>
          </div>
          <div class="modal-section">
            <div class="modal-label">Clases planificadas</div>
            ${clasesHtml || '<div class="modal-value">—</div>'}
          </div>
          ${p.actCompDescripcion ? `
          <div class="modal-section">
            <div class="modal-label">Actividad complementaria</div>
            <div class="modal-value">${p.actCompDescripcion}</div>
          </div>
          ` : ''}
          ${p.obsFamilias ? `
          <div class="modal-section">
            <div class="modal-label">Comunicación a familias</div>
            <div class="modal-value">${p.obsFamilias}</div>
          </div>
          ` : ''}
          ${p.observacionCoordinacion ? `
          <div class="modal-section">
            <div class="modal-label" style="color: #f59e0b;">Observación del coordinador</div>
            <div class="modal-value" style="background:rgba(245,158,11,0.05); border-color:rgba(245,158,11,0.2); color:#fbbf24;">${p.observacionCoordinacion}</div>
          </div>
          ` : ''}
        </div>
        <div class="modal-footer">
          ${estadoInfo.estado === 'con_ajustes' ? `
            <button class="modal-btn modal-btn-primary" onclick="editarPlaneacion('${p.planeacionId}')">
              ✏️ Editar y reenviar
            </button>
          ` : `
            <button class="modal-btn modal-btn-secondary" onclick="cerrarModal()">Cerrar</button>
          `}
        </div>
      </div>
    </div>
  `;
  
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.body.style.overflow = 'hidden';
}

function cerrarModal() {
  const modal = document.getElementById('modalPlaneacion');
  if (modal) modal.remove();
  document.body.style.overflow = '';
}

function editarPlaneacion(id) {
  window.location.href = `/planeaciones/?editar=1&planeacionId=${id}`;
}

// ==================================================
// INIT
// ==================================================
async function init() {
  const sesion = obtenerSesion();
  if (!sesion || !sesion.correo) { window.location.href = '/'; return; }
  
  ST = { ...ST, correo: sesion.correo, nombre: sesion.nombre || '', rol: sesion.rol || 'docente', docenteId: sesion.docenteId };
  document.getElementById('rolVista').textContent = String(ST.rol).toUpperCase();
  
  semanaActual = calcularSemanaActual();
  semanaSeleccionada = 8; // FORZADO a Semana 8
  periodoActivo = 'P2';   // FORZADO a Período 2
  
  await cargarMaterias();
  await cargarPlaneaciones();
  
  renderSemanas();
  renderPeriodo();
  renderCards();
}

init();
</script>
