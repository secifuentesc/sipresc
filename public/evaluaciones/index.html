<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluaciones — La Presentación</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#0a1628;
font-family:'IBM Plex Sans',sans-serif;
color:#e8edf8;
}

.container{
text-align:center;
max-width:420px;
padding:20px;
}

.icon{
width:90px;
height:90px;
border-radius:20px;
background:linear-gradient(135deg,#0f2657,#1e4db7);
display:flex;
align-items:center;
justify-content:center;
margin:auto;
margin-bottom:20px;
box-shadow:0 10px 30px rgba(30,77,183,.4);
}

.icon span{
font-size:40px;
}

.title{
font-size:22px;
font-weight:600;
margin-bottom:8px;
}

.subtitle{
font-size:14px;
color:#7a8fb0;
margin-bottom:25px;
}

.badge{
display:inline-block;
padding:6px 12px;
border-radius:20px;
font-family:'IBM Plex Mono',monospace;
font-size:10px;
letter-spacing:1px;
background:rgba(201,150,42,.15);
border:1px solid rgba(201,150,42,.3);
color:#e8b84b;
}

.btn{
margin-top:25px;
padding:12px 20px;
border-radius:10px;
border:none;
background:linear-gradient(135deg,#c9962a,#e8b84b);
color:#0a1628;
font-family:'IBM Plex Mono',monospace;
font-size:11px;
letter-spacing:1px;
cursor:pointer;
}

.btn:active{
transform:scale(.97);
}
</style>
</head>

<body>

<div class="container">

<div class="icon">
<span>🛠️</span>
</div>

<div class="title">Evaluaciones Finales</div>

<div class="subtitle">
Este módulo se encuentra en desarrollo.<br>
Pronto estará disponible para toda la institución.
</div>

<div class="badge">EN CONSTRUCCIÓN</div>

<br>

<button class="btn" onclick="window.history.back()">
← Volver
</button>

</div>

</body>
</html>
