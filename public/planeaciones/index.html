<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png" href="/logo.png">

<style>

/* 🔥 EXACTAMENTE EL MISMO ESTILO */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0a1628;--blue:#1a3a6b;--royal:#0f2657;--cobalt:#1e4db7;
  --gold:#c9962a;--gold2:#e8b84b;--gold3:rgba(201,150,42,.12);
  --s0:#050e1d;--s1:#0d1f3c;--s2:#122449;--s3:#182e58;
  --br:rgba(255,255,255,.07);--br2:rgba(255,255,255,.13);
  --tx:#e8edf8;--mt:#7a8fb0;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  --green:#4ade80;
}

body{
  background:var(--s0);
  color:var(--tx);
  font-family:var(--sans);
  background-image:
  radial-gradient(ellipse 60% 50% at 15% 0%,rgba(26,58,107,.5) 0%,transparent 70%),
  radial-gradient(ellipse 50% 40% at 85% 100%,rgba(30,77,183,.25) 0%,transparent 70%);
}

/* 🔥 TOPBAR ORIGINAL */
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(5,14,29,.96);
  border-bottom:1px solid var(--br);
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:8px;
  backdrop-filter:blur(14px);
}

.topbar-logo{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(140deg,var(--royal),var(--cobalt));
  display:flex;align-items:center;justify-content:center;
}

.logo-img-top{width:20px}

.topbar h1{
  font-family:var(--mono);
  font-size:12px;
  flex:1;
}

.topbar-rol{
  font-size:9px;
  color:var(--gold);
  background:var(--gold3);
  padding:3px 8px;
  border-radius:20px;
}

.logout-btn{
  background:none;
  border:none;
  color:var(--mt);
  font-size:11px;
}

/* 🔥 CONTENIDO */
.container{
  padding:20px;
  min-height:calc(100vh - 60px);
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

/* 🔥 CARD ORIGINAL */
.card{
  width:100%;
  max-width:520px;
  background:var(--s2);
  border:1px solid var(--br);
  border-radius:14px;
  padding:18px;
}

/* 🔥 FORM ORIGINAL */
.fg{margin-bottom:14px}

.fl{
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--mt);
  margin-bottom:6px;
}

.fi,.fta{
  width:100%;
  background:var(--s1);
  border:1px solid var(--br);
  border-radius:9px;
  color:var(--tx);
  padding:12px;
  font-size:15px;
}

.fta{min-height:80px}

/* 🔥 BOTÓN ORIGINAL */
.btn{
  width:100%;
  padding:14px;
  border-radius:11px;
  border:none;
  font-family:var(--mono);
  font-size:11px;
  text-transform:uppercase;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#000;
  cursor:pointer;
}

.form-app{
  width:100%;
  max-width:520px;
}

.title{
  font-size:24px;
  font-weight:600;
  margin-bottom:6px;
}

.subtitle{
  font-size:13px;
  color:var(--mt);
  margin-bottom:30px;
}

.bloque{
  margin-bottom:26px;
  transition:all .4s ease;
}

.oculto{
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  height:0;
  overflow:hidden;
}

.pregunta{
  display:block;
  font-size:14px;
  margin-bottom:6px;
  color:var(--mt);
}

.input{
  width:100%;
  background:transparent;
  border:none;
  border-bottom:1px solid var(--br2);
  color:var(--tx);
  font-size:18px;
  padding:10px 0;
  outline:none;
}

.input:focus{
  border-bottom:1px solid var(--gold);
}

.textarea{
  min-height:70px;
}

.estado{
  margin-top:20px;
  font-size:12px;
  color:var(--green);
  opacity:.7;
}
.intensidad-item{
  flex:1;
  text-align:center;
  padding:14px;
  border-radius:10px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--br);
  font-size:18px;
  font-weight:600;
  cursor:pointer;

  transition: all .2s ease;
}

/* 🔥 EFECTO HOVER */
.intensidad-item:hover{
  transform: translateY(-3px);
  background: rgba(255,255,255,0.08);
  border-color: var(--gold);
  box-shadow: 0 6px 16px rgba(0,0,0,0.25);
}

.intensidad-item.activa{
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color:#000;
  border: none;
}
  
.intensidad-item:active{
  transform: scale(0.95);
}

.btn-opcion{
  flex:1;
  text-align:center;
  padding:12px;
  border-radius:10px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--br);
  cursor:pointer;
  transition: all .2s ease;
}

.btn-opcion:hover{
  transform: translateY(-2px);
  border-color: var(--gold);
}

.btn-opcion.activa{
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color:#000;
  border:none;
}

#btnBack{
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  cursor:pointer;
  box-shadow: 0 6px 18px rgba(0,0,0,.4);
  z-index:50;

  opacity:0;
  pointer-events:none;
  transition: all .3s ease;
}

#btnBack.activo{
  opacity:1;
  pointer-events:auto;
}

#btnEnviar{
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
  box-shadow: 0 6px 18px rgba(0,0,0,.4);
  z-index:50;

  opacity:0;
  transform: scale(.8);
  pointer-events:none;
}

#btnEnviar.activo{
  opacity:1;
  transform: scale(1);
  pointer-events:auto;
}
</style>
</head>

<body>

<!-- 🔥 TOPBAR ORIGINAL EXACTA -->
<div class="topbar">
  <div class="topbar-logo">
    <img src="/logo.png" class="logo-img-top">

</div>

<!-- 🔥 CONTENIDO -->
<div class="container">

  <div class="form-app">

  <!-- 🔵 PASO 1 -->
  <div id="paso1">

    </div>

    <div class="subtitle">

    <div class="btn-opcion activa" onclick="toggleGrupo('A', this)">A</div>
    <div class="btn-opcion activa" onclick="toggleGrupo('B', this)">B</div>

</div>

    <!-- SEMANA -->
    <div class="bloque oculto" id="b-semana">
      <label class="pregunta">Semana</label>

    <!-- OBSERVACIÓN -->
<div class="bloque oculto" id="b-observacion">
  <label class="pregunta">¿La clase anterior tuvo alguna novedad?</label>

  <div style="display:flex; gap:10px; margin-top:10px;">
    <div class="btn-opcion activa" onclick="setObs('no', this)">No</div>

  <div id="obsInputBox" class="oculto" style="margin-top:15px;">

      class="input textarea" 
      id="observacionInput"

    </textarea>
  </div>
</div>

<!-- INTENSIDAD -->
<div class="bloque oculto" id="b-intensidad">
  <label class="pregunta">Clases en la semana</label>
  <div id="intensidadBox" style="display:flex; gap:10px;"></div>
</div>

    </div> <!-- 🔴 CIERRA PASO 1 -->

<!-- 🔵 PASO 2 -->
<div id="paso2" class="oculto">

    <div class="bloque oculto" id="b-planeacion">
  <div id="planeacionBox"></div>
</div>

<!-- 🔵 ACTIVIDADES COMPLEMENTARIAS -->
<div class="bloque oculto" id="b-complementaria">

  <label class="pregunta">¿Actividades complementarias?</label>

  <div style="display:flex; gap:10px; margin-top:10px;">
    <div class="btn-opcion activa" onclick="setComp('no', this)">No</div>
    <div class="btn-opcion" onclick="setComp('si', this)">Sí</div>
  </div>

  <div id="compBox" class="oculto" style="margin-top:15px;">

    <label class="pregunta">Actividad obligatoria</label>

    <label class="pregunta" style="margin-top:14px;">Anexo (opcional)</label>
    <input class="input" id="compAnexo" placeholder="Pega aquí el enlace de Drive">

    <div style="font-size:11px; color:var(--mt); margin-top:6px;">
      Carpeta institucional de anexos
    </div>

  </div>

</div>

  <!-- 🔵 COMUNICACIÓN A FAMILIAS -->
<div class="bloque oculto" id="b-familias">

  <label class="pregunta">¿Comunicación a las familias?</label>

  <div style="display:flex; gap:10px; margin-top:10px;">
    <div class="btn-opcion activa" onclick="setFam('no', this)">No</div>
    <div class="btn-opcion" onclick="setFam('si', this)">Sí</div>
  </div>

  <div id="famBox" class="oculto" style="margin-top:15px;">

    <label class="pregunta">Observación para las familias</label>
    <textarea class="input textarea" id="famObs"></textarea>

    <label class="pregunta" style="margin-top:14px;">Anexo (opcional)</label>
    <input class="input" id="famAnexo" placeholder="Pega aquí el enlace de Drive">

  </div>

</div>

    <!-- ESTADO -->
    <div id="estadoGuardado" class="estado">
      Guardado automático
    </div>

  </div>

</div>

<div id="btnBack" onclick="volverPaso1()">←</div>

<div id="btnEnviar" onclick="enviarPlaneacion()">✓</div>

<div id="modalExito" style="
position:fixed;
inset:0;
background:rgba(5,14,29,.85);
backdrop-filter:blur(8px);
display:flex;
align-items:center;
justify-content:center;
z-index:999;
opacity:0;
pointer-events:none;
transition:all .3s ease;
">

  <div style="
  background:var(--s2);
  border:1px solid var(--br);
  border-radius:14px;
  padding:28px;
  text-align:center;
  width:90%;
  max-width:320px;
  ">

    <div style="
    font-size:18px;
    font-weight:600;
    margin-bottom:10px;
    ">
      Planeación enviada
    </div>

    <div style="
    font-size:13px;
    color:var(--mt);
    margin-bottom:22px;
    ">
      Todo se guardó correctamente
    </div>

    <!-- BOTONES -->
    <div style="display:flex; flex-direction:column; gap:10px;">

      <button onclick="nuevaPlaneacion()" class="btn">
        Nueva planeación
      </button>

      <button onclick="volverInicio()" style="
      padding:12px;
      border-radius:10px;
      border:1px solid var(--br);
      background:transparent;
      color:var(--tx);
      font-family:var(--mono);
      font-size:11px;
      text-transform:uppercase;
      cursor:pointer;
      ">
        Volver al inicio
      </button>

    </div>

  </div>
</div>
  
<script>

let ST = {
  materia: null,
  grado: null
};

const API = "/api/planeaciones"; // ⚠️ ajusta si tu ruta es otra

// 🔥 INICIO
window.addEventListener("load", () => {

  // 🔥 TEMPORAL (para que funcione YA)
  localStorage.setItem("correo","secifuentes@lapresentaciongirardota.edu.co");

  cargarMaterias();
  cargarBorrador();
});

// 🔥 CARGAR MATERIAS
const CACHE_KEY = "materias_cache_v1";
const CACHE_TIME = "materias_cache_time";
const CACHE_MAX_AGE = 1000 * 60 * 60 * 6; // 6 horas

async function cargarMaterias(){

  const correo = localStorage.getItem("correo") || "secifuentes@lapresentaciongirardota.edu.co";
  const select = document.getElementById("materiaSelect");

  // 🔒 Bloquear mientras carga
  select.disabled = true;
  select.innerHTML = '<option value="">Cargando...</option>';

  try {

    const res = await fetch(`${API}?accion=cargaDocente&correo=${correo}`);
    const json = await res.json();

    if (json.ok && json.materias) {

      // 🔥 1. Guardar data SIEMPRE
      ST.data = json.materias;

      // 🔥 2. Pintar SIEMPRE
      pintarMaterias(json.materias);

      // 🔥 3. Guardar cache
      localStorage.setItem("materias_cache_v1", JSON.stringify(json.materias));
      localStorage.setItem("materias_cache_time", Date.now());

    } else {
      select.innerHTML = '<option value="">Sin materias disponibles</option>';
    }

  } catch (err) {

    console.warn("Error en API, usando cache");

    const cache = localStorage.getItem("materias_cache_v1");

    if (cache) {
      ST.data = JSON.parse(cache);
      pintarMaterias(ST.data);
    } else {
      select.innerHTML = '<option value="">Error de conexión</option>';
    }

  }

  // 🔓 Activar select al final
  select.disabled = false;
}
  
function pintarMaterias(materias){

  const select = document.getElementById("materiaSelect");

  select.innerHTML = '<option value="">Seleccionar...</option>';

  materias.forEach(m => {
    const op = document.createElement("option");
    op.value = m.asignatura;
    op.textContent = m.asignatura;
    select.appendChild(op);
    select.disabled = false;
  });
  

}

// 🔥 CUANDO SELECCIONA MATERIA
function onMateria(){

  const materia = document.getElementById("materiaSelect").value;
  ST.materia = materia;

  const bloque = document.getElementById("b-grado");
  const gradoSelect = document.getElementById("gradoSelect");

  gradoSelect.innerHTML = '<option value="">Seleccionar grado...</option>';

  ocultar("b-semana");
  ocultar("b-planeacion");

  if(!materia){
    bloque.classList.add("oculto");
    return;
  }

  if (!ST.data) {
    console.warn("No hay datos cargados aún");
    return;
  }

  // 🔥 ESTA LÍNEA FALTABA
  const data = ST.data.find(m => m.asignatura === materia);

  if (!data || !data.grados) {
    bloque.classList.add("oculto");
    return;
  }

  const gradosUnicos = [...new Set(
  data.grados.map(g => g.replace(/\s+[A-B]$/, "").trim())
)];

gradosUnicos.forEach(g => {
  const op = document.createElement("option");
  op.value = g;
  op.textContent = g;
  gradoSelect.appendChild(op);
});

  bloque.classList.remove("oculto");
}

// 🔥 CUANDO SELECCIONA GRADO
function onGrado(){

  const grado = document.getElementById("gradoSelect").value;
  ST.grado = grado;

  if(!grado) return;

  // 🔥 Mostrar grupos primero
const gradosAB = ["PRIMERO","SEGUNDO","TERCERO","CUARTO","QUINTO","SEXTO"];

if(gradosAB.includes(grado.toUpperCase())){
  mostrar("b-grupos");
  ST.grupos = ["A","B"];
}else{
  ocultar("b-grupos");
  ST.grupos = [];
}

// 🔥 Luego semana
generarSemanas();
mostrar("b-semana");

// 🔥 Luego lo demás
mostrar("b-intensidad");
mostrarIntensidad();
mostrar("b-observacion"); // 🔥 AQUÍ

  document.getElementById("estadoGuardado").textContent =
    `${ST.materia} · ${ST.grado}`;
}

// 🔥 MOSTRAR BLOQUES
function mostrar(id){
  document.getElementById(id).classList.remove("oculto");
}

// 🔥 SEMANA AUTOMÁTICA
function calcularSemana(){
  const hoy = new Date();
  const inicio = new Date(hoy.getFullYear(), 0, 1);
  const semana = Math.ceil((((hoy - inicio) / 86400000) + inicio.getDay()+1)/7);
  return `Semana ${semana}`;
}

// 🔥 AUTOGUARDADO (SIMULADO)
["semanaInput","indicadorInput","actividadesInput"].forEach(id => {

  document.addEventListener("input", e => {
    if(e.target.id === id){
      guardarAuto();
    }
  });

});


function ocultar(id){
  document.getElementById(id).classList.add("oculto");
}
function mostrarIntensidad(){

  const box = document.getElementById("intensidadBox");

  box.innerHTML = "";

  for(let i = 1; i <= 5; i++){
    const div = document.createElement("div");
    div.className = "intensidad-item";
    div.textContent = i;

    // 🔥 CLICK PARA SELECCIONAR
    div.onclick = () => {
  document.querySelectorAll(".intensidad-item").forEach(el => el.classList.remove("activa"));
  div.classList.add("activa");

  ST.intensidad = i;

generarPlaneacion();

setTimeout(() => {
  irPaso2();
}, 200);

guardarAuto();

validarBotonEnviar(); // 🔥 fuerza primera validación
};

    box.appendChild(div);
  }

}

function generarPlaneacion(){

  const box = document.getElementById("planeacionBox");
  box.innerHTML = "";

  const indicador = document.createElement("div");
  indicador.innerHTML = `
    <label class="pregunta">Indicador de desempeño</label>
    <textarea class="input textarea" id="indicadorInput"></textarea>
  `;
  box.appendChild(indicador);

  const total = ST.intensidad || 1;

  for(let i = 1; i <= total; i++){

    const bloque = document.createElement("div");
    bloque.style.marginTop = "28px";

    bloque.innerHTML = `
      <div style="font-family:var(--mono); font-size:11px; color:var(--gold); margin-bottom:12px;">
        CLASE ${i}
      </div>

      <label class="pregunta">Tema(s) de la clase ${i}</label>
      <textarea class="input textarea" id="tema_${i}"></textarea>

      <label class="pregunta" style="margin-top:14px;">Actividades principales de la clase ${i}</label>
      <textarea class="input textarea" id="act_${i}"></textarea>
    `;

    box.appendChild(bloque);
  }

  mostrar("b-planeacion");
mostrar("b-complementaria");
mostrar("b-familias");

setTimeout(() => {

  activarValidacionInputs();
  validarBotonEnviar();

}, 100);

}

let timer;

function guardarAuto(){

  clearTimeout(timer);

  timer = setTimeout(() => {

    document.getElementById("estadoGuardado").textContent = "Guardando...";

    try {

      const data = {
        correo: localStorage.getItem("correo"),

        asignatura: ST.materia,
        grado: ST.grado,
        semana: document.getElementById("semanaSelect")?.value || "",

        indicador: document.getElementById("indicadorInput")?.value || "",

        d1_tema: document.getElementById("tema_1")?.value || "",
        d1_act: document.getElementById("act_1")?.value || "",

        d2_tema: document.getElementById("tema_2")?.value || "",
        d2_act: document.getElementById("act_2")?.value || "",

        d3_tema: document.getElementById("tema_3")?.value || "",
        d3_act: document.getElementById("act_3")?.value || "",

        d4_tema: document.getElementById("tema_4")?.value || "",
        d4_act: document.getElementById("act_4")?.value || "",

        d5_tema: document.getElementById("tema_5")?.value || "",
        d5_act: document.getElementById("act_5")?.value || "",

        intensidad: ST.intensidad || 1,

        observacion: ST.observacionActiva === "si"
          ? document.getElementById("observacionInput")?.value || ""
          : "",

        comp_obligatoria: ST.compActiva === "si"
          ? document.getElementById("compObligatoria")?.value || ""
          : "",

        comp_anexo: ST.compActiva === "si"
          ? document.getElementById("compAnexo")?.value || ""
          : "",

        fam_obs: ST.famActiva === "si"
          ? document.getElementById("famObs")?.value || ""
          : "",

        fam_anexo: ST.famActiva === "si"
          ? document.getElementById("famAnexo")?.value || ""
          : ""
      };

      // 🔥 GUARDADO LOCAL (AQUÍ ESTÁ LA CLAVE)
      localStorage.setItem("planeacion_borrador", JSON.stringify(data));

      document.getElementById("estadoGuardado").textContent = "Guardado local";

    } catch (error) {
      console.error(error);
      document.getElementById("estadoGuardado").textContent = "Error guardando";
    }

  }, 800); // más rápido y fluido

}

function calcularSemanaActual(){

  // 🔥 Semana 5 inicia el 25 abril 2026 a las 12:00 (hora Colombia)
  const inicioBase = new Date("2026-04-25T12:00:00-05:00");

  const ahora = new Date();

  const unaSemana = 7 * 24 * 60 * 60 * 1000;

  // 🔢 Diferencia en semanas desde la base
  const diffSemanas = Math.floor((ahora.getTime() - inicioBase.getTime()) / unaSemana);

  // 🔥 Ciclo de 10 semanas
  let semana = 5 + diffSemanas;

  // 🔁 Convertir a ciclo 1–10
  semana = ((semana - 1) % 10 + 10) % 10 + 1;

  return semana;
}

function generarSemanas(){

  const select = document.getElementById("semanaSelect");
  const actual = calcularSemanaActual();

  select.innerHTML = "";

  for(let i = 1; i <= 10; i++){

    const op = document.createElement("option");
    op.value = `Semana ${i}`;
    op.textContent = `Semana ${i}`;

    // 🔴 Bloquear semanas pasadas
    if(i < actual){
      op.disabled = true;
      op.style.color = "#777";
    }

    // 🔵 Seleccionar semana actual automáticamente
    if(i === actual){
      op.selected = true;
    }

    select.appendChild(op);
  }

}

async function enviarPlaneacion(){

  document.getElementById("estadoGuardado").textContent = "Enviando...";

  try {

    await fetch(API,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
  asignatura: ST.materia,
  grado: ST.grado,
  gruposDestino: (ST.grupos || []).join(","),

  semana: document.getElementById("semanaSelect").value.toUpperCase(),

  indicador: document.getElementById("indicadorInput")?.value || "",

        d1_tema: document.getElementById("tema_1")?.value || "",
        d1_act: document.getElementById("act_1")?.value || "",

        d2_tema: document.getElementById("tema_2")?.value || "",
        d2_act: document.getElementById("act_2")?.value || "",

        d3_tema: document.getElementById("tema_3")?.value || "",
        d3_act: document.getElementById("act_3")?.value || "",

        d4_tema: document.getElementById("tema_4")?.value || "",
        d4_act: document.getElementById("act_4")?.value || "",

        d5_tema: document.getElementById("tema_5")?.value || "",
        d5_act: document.getElementById("act_5")?.value || "",

        intensidad: ST.intensidad || 1,

        observacion: ST.observacionActiva === "si"
          ? document.getElementById("observacionInput").value
          : "",

        comp_obligatoria: ST.compActiva === "si"
          ? document.getElementById("compObligatoria").value
          : "",

        comp_anexo: ST.compActiva === "si"
          ? document.getElementById("compAnexo").value
          : "",

        fam_obs: ST.famActiva === "si"
          ? document.getElementById("famObs").value
          : "",

        fam_anexo: ST.famActiva === "si"
          ? document.getElementById("famAnexo").value
          : "",

        accion: "guardarFinal" // 🔥 IMPORTANTE PARA TU BACKEND
      })
    });

    localStorage.removeItem("planeacion_borrador");

    document.getElementById("estadoGuardado").textContent = "Planeación enviada correctamente";

    setTimeout(() => {
      document.getElementById("estadoGuardado").textContent = "Planeación enviada ✔";
      mostrarExito();
    }, 600);

  } catch (error) {
    console.error(error);
    document.getElementById("estadoGuardado").textContent = "Error al enviar";
  }
}

function cargarBorrador(){

  const data = localStorage.getItem("planeacion_borrador");
  if(!data) return;

  const d = JSON.parse(data);

  // 🔹 Restaurar selects
  if(d.semana){
    document.getElementById("semanaSelect").value = d.semana;
  }

  // 🔹 Restaurar indicador
  setTimeout(() => {

    if(document.getElementById("indicadorInput")){
      document.getElementById("indicadorInput").value = d.indicador || "";
    }

    // 🔹 Restaurar clases
    for(let i=1;i<=5;i++){
      if(document.getElementById("tema_"+i)){
        document.getElementById("tema_"+i).value = d["d"+i+"_tema"] || "";
      }
      if(document.getElementById("act_"+i)){
        document.getElementById("act_"+i).value = d["d"+i+"_act"] || "";
      }
    }

    // 🔹 Complementarias
    if(d.comp_obligatoria){
      document.getElementById("compObligatoria").value = d.comp_obligatoria;
    }

    if(d.comp_anexo){
      document.getElementById("compAnexo").value = d.comp_anexo;
    }

    // 🔹 Familias
    if(d.fam_obs){
      document.getElementById("famObs").value = d.fam_obs;
    }

    if(d.fam_anexo){
      document.getElementById("famAnexo").value = d.fam_anexo;
    }

  }, 800);

} 




function validarBotonEnviar(){

  const indicador = document.getElementById("indicadorInput")?.value || "";

  let hayContenido = false;

  for(let i = 1; i <= 5; i++){
    const t = document.getElementById("tema_"+i)?.value || "";
    const a = document.getElementById("act_"+i)?.value || "";

    if(t.trim().length > 3 || a.trim().length > 3){
      hayContenido = true;
      break;
    }
  }

  if(indicador.trim().length > 5 && hayContenido){
    document.getElementById("btnEnviar").classList.add("activo");
  } else {
    document.getElementById("btnEnviar").classList.remove("activo");
  }

}

document.addEventListener("input", function(e){

  if(
    e.target.id === "indicadorInput" ||
    (e.target.id && e.target.id.startsWith("tema_")) ||
    (e.target.id && e.target.id.startsWith("act_"))
  ){
    validarBotonEnviar();
  }

});

function activarValidacionInputs(){

  const inputs = document.querySelectorAll("#planeacionBox textarea");

  inputs.forEach(input => {

    input.addEventListener("input", () => {
      validarBotonEnviar();
    });

    input.addEventListener("keyup", () => {
      validarBotonEnviar();
    });

  });

}

function toggleGrupo(grupo, el){

  if(!ST.grupos) ST.grupos = ["A","B"];

  if(ST.grupos.includes(grupo)){
    ST.grupos = ST.grupos.filter(g => g !== grupo);
    el.classList.remove("activa");
  } else {
    ST.grupos.push(grupo);
    el.classList.add("activa");
  }

  guardarAuto();
}
