<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIPRESC | Planeaciones</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0a1628;
  --card:#122449;
  --border:rgba(255,255,255,.08);
  --text:#e8edf8;
  --muted:#7a8fb0;
  --gold:#FFCC00;
  --blue:#1A428A;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--ink);
  font-family:'Montserrat',sans-serif;
  color:var(--text);
}

.header{
  background:rgba(5,14,29,.95);
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
}

.header h1{
  font-size:13px;
  font-weight:500;
}

.badge{
  background:rgba(255,204,0,.15);
  color:var(--gold);
  padding:6px 12px;
  border-radius:20px;
  font-size:11px;
}

.container{
  max-width:800px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
}

h2{
  font-size:14px;
  margin-bottom:15px;
  color:var(--gold);
  letter-spacing:1px;
}

label{
  font-size:11px;
  color:var(--muted);
  margin-bottom:5px;
  display:block;
  letter-spacing:1px;
}

input, select, textarea{
  width:100%;
  background:#0d1f3c;
  border:1px solid var(--border);
  color:var(--text);
  padding:11px;
  border-radius:8px;
  margin-bottom:14px;
  font-size:14px;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  width:100%;
  background:linear-gradient(135deg,#1A428A,#0f2657);
  border:none;
  padding:13px;
  border-radius:10px;
  color:white;
  font-size:12px;
  font-weight:600;
  letter-spacing:1px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.msg{
  margin-top:10px;
  font-size:12px;
  text-align:center;
}
</style>
</head>

<body>

<div class="header">
  <h1>SIPRESC | PLANEACIONES</h1>
  <div class="badge" id="docenteNombre">Cargando...</div>
</div>

<div class="container">

<div class="card">

<h2>NUEVA PLANEACIÓN</h2>

<label>ASIGNATURA</label>
<select id="asignatura"></select>

<div class="row">
  <div>
    <label>GRADO</label>
    <input id="grado">
  </div>
  <div>
    <label>GRUPO</label>
    <input id="grupo">
  </div>
</div>

<label>SEMANA</label>
<input id="semana" placeholder="Ej: SEMANA 1">

<label>INDICADOR</label>
<textarea id="indicador"></textarea>

<label>CLASE 1 - TEMA</label>
<textarea id="d1tema"></textarea>

<label>CLASE 1 - ACTIVIDADES</label>
<textarea id="d1act"></textarea>

<button onclick="guardar()">GUARDAR PLANEACIÓN</button>

<div class="msg" id="msg"></div>

</div>

</div>

<script>

// 🔥 TOMAR SESIÓN REAL DE SIPRESC
const usuario = JSON.parse(localStorage.getItem("lp_user") || "{}");

if(!usuario.correo){
  alert("Sesión no encontrada");
}

// Mostrar nombre
document.getElementById("docenteNombre").innerText = usuario.correo.split("@")[0];

// 🔵 CARGAR MATERIAS
function cargarMaterias(){

  fetch(`/api/planeaciones?accion=cargaDocente&correo=${usuario.correo}`)
    .then(res=>res.json())
    .then(data=>{

      const select = document.getElementById("asignatura");
      select.innerHTML = "";

      data.materias.forEach(m=>{
        const op = document.createElement("option");
        op.value = m;
        op.textContent = m;
        select.appendChild(op);
      });

    });

}

cargarMaterias();

// 💾 GUARDAR
function guardar(){

  const msg = document.getElementById("msg");

  const data = {
    correo: usuario.correo,
    asignatura: document.getElementById("asignatura").value,
    grado: document.getElementById("grado").value,
    gruposDestino: document.getElementById("grupo").value,
    semana: document.getElementById("semana").value,

    indicador: document.getElementById("indicador").value,
    d1_tema: document.getElementById("d1tema").value,
    d1_act: document.getElementById("d1act").value
  };

  msg.innerText = "Guardando...";

  fetch(`/api/planeaciones`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body: JSON.stringify(data)
  })
  .then(res=>res.json())
  .then(res=>{

    if(res.ok){
      msg.style.color = "#2dd4a0";
      msg.innerText = "Planeación guardada correctamente";

    }else{
      msg.style.color = "#f06b6b";
      msg.innerText = res.mensaje;
    }

  })
  .catch(()=>{
    msg.style.color = "#f06b6b";
    msg.innerText = "Error de conexión";
  });

}

</script>

</body>
</html>
