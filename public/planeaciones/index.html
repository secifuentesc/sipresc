<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Planeaciones — La Presentación</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* 🔥 ESTILO SIPRESC ORIGINAL (SIMPLIFICADO PERO IGUAL VISUALMENTE) */
:root{
  --s0:#050e1d;
  --s1:#0d1f3c;
  --s2:#122449;
  --tx:#e8edf8;
  --mt:#7a8fb0;
  --gold:#c9962a;
  --gold2:#e8b84b;
  --br:rgba(255,255,255,.07);
  --br2:rgba(255,255,255,.13);
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--s0);
  color:var(--tx);
  font-family:var(--sans);
}

/* TOPBAR (NO SE TOCA) */
.topbar{
  position:sticky;
  top:0;
  background:rgba(5,14,29,.96);
  border-bottom:1px solid var(--br);
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
}

.topbar h1{
  font-family:var(--mono);
  font-size:12px;
  flex:1;
}

.topbar-rol{
  font-size:10px;
  color:var(--gold);
}

.logout-btn{
  background:none;
  border:none;
  color:var(--mt);
  cursor:pointer;
}

/* TAB */
.tab{
  padding:20px;
}

/* 🔥 NUEVO: CENTRADO */
.form-center{
  max-width:520px;
  margin:0 auto;
  width:100%;
}

/* CARD */
.card{
  background:var(--s2);
  border:1px solid var(--br);
  border-radius:14px;
  padding:20px;
}

/* FORM */
.fl{
  font-family:var(--mono);
  font-size:10px;
  color:var(--mt);
  margin-bottom:6px;
  display:block;
}

.fi, .fta{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid var(--br);
  background:var(--s1);
  color:var(--tx);
  margin-bottom:12px;
}

.fta{
  min-height:90px;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  font-family:var(--mono);
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#000;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- TOPBAR ORIGINAL -->
<div class="topbar">
  <h1>SIPRESC - Planeaciones</h1>
  <span class="topbar-rol">DOCENTE</span>
  <button class="logout-btn">Salir</button>
</div>

<!-- CONTENIDO -->
<div class="tab">

  <!-- 🔥 CENTRADO PERFECTO -->
  <div class="form-center">

    <div class="card">

      <label class="fl">Semana</label>
      <input class="fi" placeholder="Ej: Semana 3">

      <label class="fl">Grado</label>
      <input class="fi" placeholder="Ej: Octavo">

      <label class="fl">Asignatura</label>
      <input class="fi" placeholder="Ej: Tecnología">

      <label class="fl">Indicador</label>
      <textarea class="fta"></textarea>

      <label class="fl">Actividades</label>
      <textarea class="fta"></textarea>

      <button class="btn">Guardar Planeación</button>

    </div>

  </div>

</div>

</body>
</html>
