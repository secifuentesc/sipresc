<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIPRESC | Planeaciones</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* 🔥 MISMAS VARIABLES SIPRESC */
:root{
  --ink:#0a1628;--blue:#1a3a6b;--royal:#0f2657;--cobalt:#1e4db7;
  --gold:#c9962a;--gold2:#e8b84b;--gold3:rgba(201,150,42,.12);
  --s0:#050e1d;--s1:#0d1f3c;--s2:#122449;
  --br:rgba(255,255,255,.07);--br2:rgba(255,255,255,.13);
  --tx:#e8edf8;--mt:#7a8fb0;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--s0);
  color:var(--tx);
  font-family:var(--sans);
  padding-bottom:40px;
}

/* 🔥 TOPBAR EXACTO */
.topbar{
  background:rgba(5,14,29,.96);
  border-bottom:1px solid var(--br);
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:10px;
}

.topbar h1{
  font-family:var(--mono);
  font-size:12px;
  flex:1;
}

.back{
  font-size:18px;
  cursor:pointer;
}

/* 🔥 CONTENIDO */
.container{
  padding:15px;
}

/* 🔥 CARD */
.card{
  background:var(--s2);
  border:1px solid var(--br);
  border-radius:14px;
  padding:15px;
}

/* 🔥 LABEL */
.fl{
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:2px;
  color:var(--mt);
  margin-bottom:6px;
  display:block;
}

/* 🔥 INPUTS */
.fi,.fs,.fta{
  width:100%;
  background:var(--s1);
  border:1px solid var(--br);
  border-radius:9px;
  color:var(--tx);
  padding:12px;
  margin-bottom:12px;
  font-size:14px;
}

.fta{
  min-height:70px;
}

/* 🔥 BOTÓN */
.btn{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:none;
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:1px;
  cursor:pointer;
}

.btn-g{
  background:linear-gradient(135deg,#7a5a14,var(--gold));
  color:#000;
}

/* 🔥 GRID */
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
</style>
</head>

<body>

<!-- 🔥 TOPBAR -->
<div class="topbar">
  <div class="back" onclick="volver()">←</div>
  <h1>Planeaciones</h1>
</div>

<!-- 🔥 CONTENIDO -->
<div class="container">

  <div class="card">

    <label class="fl">Asignatura</label>
    <select class="fs" id="asignatura"></select>

    <div class="row">
      <div>
        <label class="fl">Grado</label>
        <input class="fi" id="grado">
      </div>

      <div>
        <label class="fl">Grupo</label>
        <input class="fi" id="grupo">
      </div>
    </div>

    <label class="fl">Semana</label>
    <input class="fi" id="semana" placeholder="SEMANA 1">

    <label class="fl">Indicador</label>
    <textarea class="fta" id="indicador"></textarea>

    <label class="fl">Clase 1 - Tema</label>
    <textarea class="fta" id="d1tema"></textarea>

    <label class="fl">Clase 1 - Actividades</label>
    <textarea class="fta" id="d1act"></textarea>

    <button class="btn btn-g" onclick="guardar()">
      Guardar planeación
    </button>

  </div>

</div>

<script>

const API = "/api/proxy";
let correo = "";

// 🔐 CARGAR SESIÓN SIPRESC
window.onload = async () => {

  const data = JSON.parse(localStorage.getItem('lp_user') || '{}');

  if (!data.correo) {
    window.location.href = "/";
    return;
  }

  correo = data.correo;

  // 🔥 VALIDAR USUARIO
  const r = await api("loginGoogle",{correo});

  if(!r.ok){
    localStorage.removeItem("lp_user");
    window.location.href = "/";
    return;
  }

  cargarMaterias();

};

// 🔥 API
function api(action, payload){
  return fetch(API,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({action, ...payload})
  }).then(r=>r.json());
}

// 🔥 MATERIAS
async function cargarMaterias(){

  const r = await api("cargaDocente",{});

  const select = document.getElementById("asignatura");
  select.innerHTML = "";

  (r.materias || []).forEach(m => {
    const op = document.createElement("option");
    op.value = m;
    op.textContent = m;
    select.appendChild(op);
  });

}

// 🔥 GUARDAR
async function guardar(){

  const data = {
    asignatura: document.getElementById("asignatura").value,
    grado: document.getElementById("grado").value,
    gruposDestino: document.getElementById("grupo").value,
    semana: document.getElementById("semana").value,
    indicador: document.getElementById("indicador").value,
    d1_tema: document.getElementById("d1tema").value,
    d1_act: document.getElementById("d1act").value
  };

  const r = await api("guardarPlaneacion", data);

  if(r.ok){
    alert("Planeación guardada");
  }else{
    alert(r.mensaje);
  }

}

// 🔙 VOLVER
function volver(){
  window.location.href = "/";
}

</script>

</body>
</html>
