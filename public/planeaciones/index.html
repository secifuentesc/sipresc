<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<title>Planeaciones — La Presentación</title>

<link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* 🔥 EXACTAMENTE EL MISMO ESTILO */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0a1628;--blue:#1a3a6b;--royal:#0f2657;--cobalt:#1e4db7;
  --gold:#c9962a;--gold2:#e8b84b;--gold3:rgba(201,150,42,.12);
  --s0:#050e1d;--s1:#0d1f3c;--s2:#122449;--s3:#182e58;
  --br:rgba(255,255,255,.07);--br2:rgba(255,255,255,.13);
  --tx:#e8edf8;--mt:#7a8fb0;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}

body{
  background:var(--s0);
  color:var(--tx);
  font-family:var(--sans);
  background-image:
  radial-gradient(ellipse 60% 50% at 15% 0%,rgba(26,58,107,.5) 0%,transparent 70%),
  radial-gradient(ellipse 50% 40% at 85% 100%,rgba(30,77,183,.25) 0%,transparent 70%);
}

/* 🔥 TOPBAR ORIGINAL */
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(5,14,29,.96);
  border-bottom:1px solid var(--br);
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:8px;
  backdrop-filter:blur(14px);
}

.topbar-logo{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(140deg,var(--royal),var(--cobalt));
  display:flex;align-items:center;justify-content:center;
}

.logo-img-top{width:20px}

.topbar h1{
  font-family:var(--mono);
  font-size:12px;
  flex:1;
}

.topbar-rol{
  font-size:9px;
  color:var(--gold);
  background:var(--gold3);
  padding:3px 8px;
  border-radius:20px;
}

.logout-btn{
  background:none;
  border:none;
  color:var(--mt);
  font-size:11px;
}

/* 🔥 CONTENIDO */
.container{
  padding:20px;
  min-height:calc(100vh - 60px);
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

/* 🔥 CARD ORIGINAL */
.card{
  width:100%;
  max-width:520px;
  background:var(--s2);
  border:1px solid var(--br);
  border-radius:14px;
  padding:18px;
}

/* 🔥 FORM ORIGINAL */
.fg{margin-bottom:14px}

.fl{
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--mt);
  margin-bottom:6px;
}

.fi,.fta{
  width:100%;
  background:var(--s1);
  border:1px solid var(--br);
  border-radius:9px;
  color:var(--tx);
  padding:12px;
  font-size:15px;
}

.fta{min-height:80px}

/* 🔥 BOTÓN ORIGINAL */
.btn{
  width:100%;
  padding:14px;
  border-radius:11px;
  border:none;
  font-family:var(--mono);
  font-size:11px;
  text-transform:uppercase;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#000;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- 🔥 TOPBAR ORIGINAL EXACTA -->
<div class="topbar">
  <div class="topbar-logo">
    <img src="/logo.png" class="logo-img-top">
  </div>

  <h1>SIPRESC - Planeaciones</h1>
  <span class="topbar-rol">DOCENTE</span>
  <button class="logout-btn">Salir</button>
</div>

<!-- 🔥 CONTENIDO -->
<div class="container">

  <div class="form-app">

    <div class="title">
      Nueva planeación
    </div>

    <div class="subtitle">
      Todo se guarda automáticamente
    </div>

    <!-- MATERIA -->
    <div class="bloque">
      <label class="pregunta">Materia</label>
      <select class="input" id="materiaSelect" onchange="onMateria()">
        <option value="">Seleccionar...</option>
      </select>
    </div>

    <!-- GRADO -->
    <div class="bloque oculto" id="b-grado">
      <label class="pregunta">Grado</label>
      <select class="input" id="gradoSelect" onchange="onGrado()">
        <option value="">Seleccionar...</option>
      </select>
    </div>

    <!-- SEMANA -->
    <div class="bloque oculto" id="b-semana">
      <label class="pregunta">Semana</label>
      <input class="input" id="semanaInput">
    </div>

    <!-- INDICADOR -->
    <div class="bloque oculto" id="b-indicador">
      <label class="pregunta">Indicador</label>
      <textarea class="input textarea" id="indicadorInput"></textarea>
    </div>

    <!-- ACTIVIDADES -->
    <div class="bloque oculto" id="b-actividades">
      <label class="pregunta">Actividades</label>
      <textarea class="input textarea" id="actividadesInput"></textarea>
    </div>

    <!-- ESTADO -->
    <div id="estadoGuardado" class="estado">
      Guardado automático
    </div>

  </div>

</div>

<script>

let DATA_DOCENTE = {
  materias: [
    {
      nombre: "Tecnología",
      grados: ["Sexto", "Séptimo", "Octavo"]
    },
    {
      nombre: "Informática",
      grados: ["Noveno", "Décimo"]
    }
  ]
};

window.addEventListener("DOMContentLoaded", () => {
  cargarMaterias();
});

function cargarMaterias() {
  const select = document.getElementById("materiaSelect");

  DATA_DOCENTE.materias.forEach(m => {
    const option = document.createElement("option");
    option.value = m.nombre;
    option.textContent = m.nombre;
    select.appendChild(option);
  });
}

function seleccionarMateria() {
  const materia = document.getElementById("materiaSelect").value;
  const bloque = document.getElementById("bloqueGrado");
  const gradoSelect = document.getElementById("gradoSelect");

  gradoSelect.innerHTML = '<option value="">Seleccionar grado...</option>';

  if (!materia) {
    bloque.style.display = "none";
    return;
  }

  const data = DATA_DOCENTE.materias.find(m => m.nombre === materia);

  data.grados.forEach(g => {
    const option = document.createElement("option");
    option.value = g;
    option.textContent = g;
    gradoSelect.appendChild(option);
  });

  bloque.style.display = "block";
}

function seleccionarGrado() {
  const grado = document.getElementById("gradoSelect").value;

  if (!grado) return;

  console.log("Listo para siguiente paso 🚀");
}

</script>

</body>
</html>
