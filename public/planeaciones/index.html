<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planeaciones</title>

<style>
body {
  font-family: Arial;
  background: #f5f6fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
}

h2 {
  color: #21145F;
}

input, select, textarea, button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  background: #1A428A;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="container">

<h2>Planeación Docente</h2>

<input type="email" id="correo" placeholder="Correo institucional">

<button onclick="cargarMaterias()">Cargar materias</button>

<select id="asignatura"></select>

<input type="text" id="grado" placeholder="Grado (Ej: TERCERO)">
<input type="text" id="grupo" placeholder="Grupo (Ej: A)">
<input type="text" id="semana" placeholder="Semana (Ej: SEMANA 1)">

<textarea id="indicador" placeholder="Indicador"></textarea>

<textarea id="d1tema" placeholder="Tema clase 1"></textarea>
<textarea id="d1act" placeholder="Actividades clase 1"></textarea>

<button onclick="guardar()">Guardar Planeación</button>

</div>

<script>

const URL = "TU_URL_DEPLOY_APPS_SCRIPT"; // 👈 pega aquí tu URL

function cargarMaterias(){

  const correo = document.getElementById("correo").value;

  fetch(`${URL}?accion=cargaDocente&correo=${correo}`)
    .then(res => res.json())
    .then(data => {

      if(!data.ok){
        alert("Docente no encontrado");
        return;
      }

      const select = document.getElementById("asignatura");
      select.innerHTML = "";

      data.materias.forEach(m => {
        const option = document.createElement("option");
        option.value = m;
        option.textContent = m;
        select.appendChild(option);
      });

    });
}

function guardar(){

  const data = {
    correo: document.getElementById("correo").value,
    asignatura: document.getElementById("asignatura").value,
    grado: document.getElementById("grado").value,
    gruposDestino: document.getElementById("grupo").value,
    semana: document.getElementById("semana").value,
    intensidad: 2,

    indicador: document.getElementById("indicador").value,
    d1_tema: document.getElementById("d1tema").value,
    d1_act: document.getElementById("d1act").value
  };

  fetch(URL, {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(res => {

    if(res.ok){
      alert("Guardado correctamente");
    } else {
      alert("Error: " + res.mensaje);
    }

  });

}

</script>

</body>
</html>
