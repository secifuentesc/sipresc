<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<title>Planeaciones — La Presentación</title>

<link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* 🔥 EXACTAMENTE EL MISMO ESTILO */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0a1628;--blue:#1a3a6b;--royal:#0f2657;--cobalt:#1e4db7;
  --gold:#c9962a;--gold2:#e8b84b;--gold3:rgba(201,150,42,.12);
  --s0:#050e1d;--s1:#0d1f3c;--s2:#122449;--s3:#182e58;
  --br:rgba(255,255,255,.07);--br2:rgba(255,255,255,.13);
  --tx:#e8edf8;--mt:#7a8fb0;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}

body{
  background:var(--s0);
  color:var(--tx);
  font-family:var(--sans);
  background-image:
  radial-gradient(ellipse 60% 50% at 15% 0%,rgba(26,58,107,.5) 0%,transparent 70%),
  radial-gradient(ellipse 50% 40% at 85% 100%,rgba(30,77,183,.25) 0%,transparent 70%);
}

/* 🔥 TOPBAR ORIGINAL */
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(5,14,29,.96);
  border-bottom:1px solid var(--br);
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:8px;
  backdrop-filter:blur(14px);
}

.topbar-logo{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(140deg,var(--royal),var(--cobalt));
  display:flex;align-items:center;justify-content:center;
}

.logo-img-top{width:20px}

.topbar h1{
  font-family:var(--mono);
  font-size:12px;
  flex:1;
}

.topbar-rol{
  font-size:9px;
  color:var(--gold);
  background:var(--gold3);
  padding:3px 8px;
  border-radius:20px;
}

.logout-btn{
  background:none;
  border:none;
  color:var(--mt);
  font-size:11px;
}

/* 🔥 CONTENIDO */
.container{
  padding:20px;
  min-height:calc(100vh - 60px);
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

/* 🔥 CARD ORIGINAL */
.card{
  width:100%;
  max-width:520px;
  background:var(--s2);
  border:1px solid var(--br);
  border-radius:14px;
  padding:18px;
}

/* 🔥 FORM ORIGINAL */
.fg{margin-bottom:14px}

.fl{
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--mt);
  margin-bottom:6px;
}

.fi,.fta{
  width:100%;
  background:var(--s1);
  border:1px solid var(--br);
  border-radius:9px;
  color:var(--tx);
  padding:12px;
  font-size:15px;
}

.fta{min-height:80px}

/* 🔥 BOTÓN ORIGINAL */
.btn{
  width:100%;
  padding:14px;
  border-radius:11px;
  border:none;
  font-family:var(--mono);
  font-size:11px;
  text-transform:uppercase;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#000;
  cursor:pointer;
}

.form-app{
  width:100%;
  max-width:520px;
}

.title{
  font-size:24px;
  font-weight:600;
  margin-bottom:6px;
}

.subtitle{
  font-size:13px;
  color:var(--mt);
  margin-bottom:30px;
}

.bloque{
  margin-bottom:26px;
  transition:all .4s ease;
}

.oculto{
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  height:0;
  overflow:hidden;
}

.pregunta{
  display:block;
  font-size:14px;
  margin-bottom:6px;
  color:var(--mt);
}

.input{
  width:100%;
  background:transparent;
  border:none;
  border-bottom:1px solid var(--br2);
  color:var(--tx);
  font-size:18px;
  padding:10px 0;
  outline:none;
}

.input:focus{
  border-bottom:1px solid var(--gold);
}

.textarea{
  min-height:70px;
}

.estado{
  margin-top:20px;
  font-size:12px;
  color:var(--green);
  opacity:.7;
}
.intensidad-item{
  flex:1;
  text-align:center;
  padding:14px;
  border-radius:10px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--br);
  font-size:18px;
  font-weight:600;
  cursor:pointer;

  transition: all .2s ease;
}

/* 🔥 EFECTO HOVER */
.intensidad-item:hover{
  transform: translateY(-3px);
  background: rgba(255,255,255,0.08);
  border-color: var(--gold);
  box-shadow: 0 6px 16px rgba(0,0,0,0.25);
}

.intensidad-item.activa{
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color:#000;
  border: none;
}
  
.intensidad-item:active{
  transform: scale(0.95);
}

.btn-opcion{
  flex:1;
  text-align:center;
  padding:12px;
  border-radius:10px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--br);
  cursor:pointer;
  transition: all .2s ease;
}

.btn-opcion:hover{
  transform: translateY(-2px);
  border-color: var(--gold);
}

.btn-opcion.activa{
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color:#000;
  border:none;
}

</style>
</head>

<body>

<!-- 🔥 TOPBAR ORIGINAL EXACTA -->
<div class="topbar">
  <div class="topbar-logo">
    <img src="/logo.png" class="logo-img-top">
  </div>

  <h1>SIPRESC - Planeaciones</h1>
  <span class="topbar-rol">DOCENTE</span>
  <button class="logout-btn">Salir</button>
</div>

<!-- 🔥 CONTENIDO -->
<div class="container">

  <div class="form-app">

    <div class="title">
      Nueva planeación
    </div>

    <div class="subtitle">
      Todo se guarda automáticamente
    </div>

    <!-- MATERIA -->
    <div class="bloque">
      <label class="pregunta">Materia</label>
      <select class="input" id="materiaSelect" onchange="onMateria()">
        <option value="">Seleccionar...</option>
      </select>
    </div>

    <!-- GRADO -->
    <div class="bloque oculto" id="b-grado">
      <label class="pregunta">Grado</label>
      <select class="input" id="gradoSelect" onchange="onGrado()">
        <option value="">Seleccionar...</option>
      </select>
    </div>

    <!-- SEMANA -->
    <div class="bloque oculto" id="b-semana">
      <label class="pregunta">Semana</label>
      <select class="input" id="semanaSelect"></select>
    </div>
    <div class="bloque oculto" id="b-intensidad">
    <div class="bloque oculto" id="b-observacion">
  <label class="pregunta">¿La clase anterior tuvo alguna novedad?</label>

  <div style="display:flex; gap:10px; margin-top:10px;">
    <div class="btn-opcion activa" onclick="setObs('no', this)">No</div>
    <div class="btn-opcion" onclick="setObs('si', this)">Sí</div>
  </div>

  <div id="obsInputBox" class="oculto" style="margin-top:15px;">
    <textarea 
      class="input textarea" 
      id="observacionInput"
      placeholder="Describe brevemente la novedad (cancelación, ajuste de horario, actividad institucional, etc.)">
    </textarea>
  </div>
</div>
  <label class="pregunta">Clases en la semana</label>
  <div id="intensidadBox" style="display:flex; gap:10px;"></div>
</div>

    <div class="bloque oculto" id="b-planeacion">
  <div id="planeacionBox"></div>
</div>

    <!-- ESTADO -->
    <div id="estadoGuardado" class="estado">
      Guardado automático
    </div>

  </div>

</div>
<script>

let ST = {
  materia: null,
  grado: null
};

const API = "/api/planeaciones"; // ⚠️ ajusta si tu ruta es otra

// 🔥 INICIO
window.addEventListener("load", () => {
  cargarMaterias();
});

// 🔥 CARGAR MATERIAS
const CACHE_KEY = "materias_cache_v1";
const CACHE_TIME = "materias_cache_time";
const CACHE_MAX_AGE = 1000 * 60 * 60 * 6; // 6 horas

async function cargarMaterias(){

  const correo = localStorage.getItem("correo") || "secifuentes@lapresentaciongirardota.edu.co";
  const select = document.getElementById("materiaSelect");

  // 🔥 1. CARGA INMEDIATA DESDE CACHE
  const cache = localStorage.getItem(CACHE_KEY);
  const cacheTime = localStorage.getItem(CACHE_TIME);

  let cacheValido = false;

  if (cache && cacheTime) {
    const edad = Date.now() - parseInt(cacheTime);
    if (edad < CACHE_MAX_AGE) {
      cacheValido = true;
    }
  }

  if (cacheValido) {
    pintarMaterias(JSON.parse(cache));
  } else {
    select.innerHTML = '<option value="">Cargando...</option>';
  }

  // 🔄 2. ACTUALIZACIÓN EN SEGUNDO PLANO
  try {

    const res = await fetch(`${API}?accion=cargaDocente&correo=${correo}`);
    const json = await res.json();

    if (json.ok && json.materias) {

      const nuevas = JSON.stringify(json.materias);
      const actuales = localStorage.getItem(CACHE_KEY);

      // 🔥 Solo actualiza si cambió (optimización real)
      if (nuevas !== actuales) {

        localStorage.setItem(CACHE_KEY, nuevas);
        localStorage.setItem(CACHE_TIME, Date.now());

        pintarMaterias(json.materias);

      }

      ST.data = json.materias;

    }

  } catch (err) {
    console.warn("Modo offline activo (usando cache)");
  }

}

function pintarMaterias(materias){

  const select = document.getElementById("materiaSelect");

  select.innerHTML = '<option value="">Seleccionar...</option>';

  materias.forEach(m => {
    const op = document.createElement("option");
    op.value = m.asignatura;
    op.textContent = m.asignatura;
    select.appendChild(op);
  });

}

// 🔥 CUANDO SELECCIONA MATERIA
function onMateria(){

  const materia = document.getElementById("materiaSelect").value;
  ST.materia = materia;

  const bloque = document.getElementById("b-grado");
  const gradoSelect = document.getElementById("gradoSelect");

  gradoSelect.innerHTML = '<option value="">Seleccionar grado...</option>';

  ocultar("b-semana");
  ocultar("b-planeacion");

  if(!materia){
    bloque.classList.add("oculto");
    return;
  }

  const data = ST.data.find(m => m.asignatura === materia);

  if (!data || !data.grados) {
    bloque.classList.add("oculto");
    return;
  }

  data.grados.forEach(g => {
    const op = document.createElement("option");
    op.value = g;
    op.textContent = g;
    gradoSelect.appendChild(op);
  });

  bloque.classList.remove("oculto");
}

// 🔥 CUANDO SELECCIONA GRADO
function onGrado(){

  const grado = document.getElementById("gradoSelect").value;
  ST.grado = grado;

  if(!grado) return;

  generarSemanas();

  mostrar("b-semana");

mostrar("b-intensidad");
mostrarIntensidad();

mostrar("b-observacion"); // 🔥 AQUÍ

  document.getElementById("estadoGuardado").textContent =
    `${ST.materia} · ${ST.grado}`;
}

// 🔥 MOSTRAR BLOQUES
function mostrar(id){
  document.getElementById(id).classList.remove("oculto");
}

// 🔥 SEMANA AUTOMÁTICA
function calcularSemana(){
  const hoy = new Date();
  const inicio = new Date(hoy.getFullYear(), 0, 1);
  const semana = Math.ceil((((hoy - inicio) / 86400000) + inicio.getDay()+1)/7);
  return `Semana ${semana}`;
}

// 🔥 AUTOGUARDADO (SIMULADO)
["semanaInput","indicadorInput","actividadesInput"].forEach(id => {

  document.addEventListener("input", e => {
    if(e.target.id === id){
      guardarAuto();
    }
  });

});

function ocultar(id){
  document.getElementById(id).classList.add("oculto");
}
function mostrarIntensidad(){

  const box = document.getElementById("intensidadBox");

  box.innerHTML = "";

  for(let i = 1; i <= 5; i++){
    const div = document.createElement("div");
    div.className = "intensidad-item";
    div.textContent = i;

    // 🔥 CLICK PARA SELECCIONAR
    div.onclick = () => {
  document.querySelectorAll(".intensidad-item").forEach(el => el.classList.remove("activa"));
  div.classList.add("activa");

  ST.intensidad = i;

  generarPlaneacion();
  guardarAuto();
};

    box.appendChild(div);
  }

}

function generarPlaneacion(){

  const box = document.getElementById("planeacionBox");
  box.innerHTML = "";

  const indicador = document.createElement("div");
  indicador.innerHTML = `
    <label class="pregunta">Indicador de desempeño</label>
    <textarea class="input textarea" id="indicadorInput"></textarea>
  `;
  box.appendChild(indicador);

  const total = ST.intensidad || 1;

  for(let i = 1; i <= total; i++){

    const bloque = document.createElement("div");
    bloque.style.marginTop = "28px";

    bloque.innerHTML = `
      <div style="font-family:var(--mono); font-size:11px; color:var(--gold); margin-bottom:12px;">
        CLASE ${i}
      </div>

      <label class="pregunta">Tema(s) de la clase ${i}</label>
      <textarea class="input textarea" id="tema_${i}"></textarea>

      <label class="pregunta" style="margin-top:14px;">Actividades principales de la clase ${i}</label>
      <textarea class="input textarea" id="act_${i}"></textarea>
    `;

    box.appendChild(bloque);
  }

  mostrar("b-planeacion");
}

let timer;

async function guardarAuto(){

  clearTimeout(timer);

  timer = setTimeout(async () => {

    document.getElementById("estadoGuardado").textContent = "Guardando...";

    await fetch(API,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        correo: localStorage.getItem("correo"),
        asignatura: ST.materia,
        grado: ST.grado,
        semana: document.getElementById("semanaSelect").value,
        indicador: document.getElementById("indicadorInput")?.value || "",
d1_tema: document.getElementById("tema_1")?.value || "",
d1_act: document.getElementById("act_1")?.value || "",
d2_tema: document.getElementById("tema_2")?.value || "",
d2_act: document.getElementById("act_2")?.value || "",
d3_tema: document.getElementById("tema_3")?.value || "",
d3_act: document.getElementById("act_3")?.value || "",
d4_tema: document.getElementById("tema_4")?.value || "",
d4_act: document.getElementById("act_4")?.value || "",
d5_tema: document.getElementById("tema_5")?.value || "",
d5_act: document.getElementById("act_5")?.value || "",
intensidad: ST.intensidad || 1,
        observacion: ST.observacionActiva === "si"
  ? document.getElementById("observacionInput").value
  : "",
})
    });

    document.getElementById("estadoGuardado").textContent = "Guardado automáticamente";

  }, 1200);

}

function calcularSemanaActual(){

  // 🔥 Semana 5 inicia el 25 abril 2026 a las 12:00 (hora Colombia)
  const inicioBase = new Date("2026-04-25T12:00:00-05:00");

  const ahora = new Date();

  const unaSemana = 7 * 24 * 60 * 60 * 1000;

  // 🔢 Diferencia en semanas desde la base
  const diffSemanas = Math.floor((ahora.getTime() - inicioBase.getTime()) / unaSemana);

  // 🔥 Ciclo de 10 semanas
  let semana = 5 + diffSemanas;

  // 🔁 Convertir a ciclo 1–10
  semana = ((semana - 1) % 10 + 10) % 10 + 1;

  return semana;
}

function generarSemanas(){

  const select = document.getElementById("semanaSelect");
  const actual = calcularSemanaActual();

  select.innerHTML = "";

  for(let i = 1; i <= 10; i++){

    const op = document.createElement("option");
    op.value = `Semana ${i}`;
    op.textContent = `Semana ${i}`;

    // 🔴 Bloquear semanas pasadas
    if(i < actual){
      op.disabled = true;
      op.style.color = "#777";
    }

    // 🔵 Seleccionar semana actual automáticamente
    if(i === actual){
      op.selected = true;
    }

    select.appendChild(op);
  }

}
function setObs(valor, el){

  ST.observacionActiva = valor;

  document.querySelectorAll("#b-observacion .btn-opcion")
    .forEach(b => b.classList.remove("activa"));

  el.classList.add("activa");

  const box = document.getElementById("obsInputBox");

  if(valor === "si"){
    box.classList.remove("oculto");
  } else {
    box.classList.add("oculto");
    document.getElementById("observacionInput").value = "";
  }

  guardarAuto();
}
</script>

</body>
</html>
