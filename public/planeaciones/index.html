<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Planeaciones — La Presentación</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050e1d;
  --card:#122449;
  --line:rgba(255,255,255,.1);
  --text:#e8edf8;
  --muted:#7a8fb0;
  --gold:#e8b84b;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  display:flex;
  justify-content:center;
}

.container{
  width:100%;
  max-width:520px;
  padding:30px 20px;
}

.title{
  font-size:26px;
  font-weight:600;
  margin-bottom:5px;
}

.subtitle{
  font-size:13px;
  color:var(--muted);
  margin-bottom:30px;
}

.bloque{
  margin-bottom:30px;
  transition:.4s;
}

.oculto{
  opacity:0;
  transform:translateY(10px);
  height:0;
  overflow:hidden;
}

label{
  font-size:13px;
  color:var(--muted);
}

input,select,textarea{
  width:100%;
  background:transparent;
  border:none;
  border-bottom:1px solid var(--line);
  color:var(--text);
  font-size:18px;
  padding:10px 0;
  outline:none;
}

input:focus,textarea:focus{
  border-bottom:1px solid var(--gold);
}

textarea{
  min-height:80px;
}

.estado{
  font-size:12px;
  color:#2dd4a0;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="title">Nueva planeación</div>
  <div class="subtitle">Se guarda automáticamente</div>

  <!-- MATERIA -->
  <div class="bloque">
    <label>Materia</label>
    <select id="materia" onchange="onMateria()">
      <option value="">Seleccionar...</option>
    </select>
  </div>

  <!-- GRADO -->
  <div class="bloque oculto" id="b-grado">
    <label>Grado</label>
    <select id="grado" onchange="onGrado()">
      <option value="">Seleccionar...</option>
    </select>
  </div>

  <!-- SEMANA -->
  <div class="bloque oculto" id="b-semana">
    <label>Semana</label>
    <input id="semana">
  </div>

  <!-- INDICADOR -->
  <div class="bloque oculto" id="b-indicador">
    <label>Indicador</label>
    <textarea id="indicador"></textarea>
  </div>

  <!-- ACTIVIDADES -->
  <div class="bloque oculto" id="b-actividades">
    <label>Actividades</label>
    <textarea id="actividades"></textarea>
  </div>

  <div id="estado" class="estado">Listo</div>

</div>

<script>

const API = "/api/planeaciones"; // 🔥 CAMBIA SI NECESITAS

let ST = {
  correo: localStorage.getItem("correo") || "secifuentes@lapresentaciongirardota.edu.co",
  materia:null,
  grado:null
};

// 🔥 INICIO
window.onload = cargarMaterias;

// 🔥 CARGAR DESDE BACKEND (CARGA_ACADEMICA)
async function cargarMaterias(){

  const res = await fetch(`${API}?accion=cargaDocente&correo=${ST.correo}`);
  const data = await res.json();

  ST.data = data.materias;

  const sel = document.getElementById("materia");

  data.materias.forEach(m=>{
    let op = document.createElement("option");
    op.value = m.asignatura;
    op.textContent = m.asignatura;
    sel.appendChild(op);
  });

}

// 🔥 MATERIA
function onMateria(){

  const val = document.getElementById("materia").value;
  ST.materia = val;

  const bloque = document.getElementById("b-grado");
  const select = document.getElementById("grado");

  select.innerHTML = '<option value="">Seleccionar...</option>';

  if(!val){
    bloque.classList.add("oculto");
    return;
  }

  const data = ST.data.find(x=>x.asignatura===val);

  data.grados.forEach(g=>{
    let op = document.createElement("option");
    op.value = g;
    op.textContent = g;
    select.appendChild(op);
  });

  bloque.classList.remove("oculto");

}

// 🔥 GRADO
function onGrado(){

  const val = document.getElementById("grado").value;
  ST.grado = val;

  if(!val) return;

  document.getElementById("semana").value = getSemana();

  show("b-semana");
  show("b-indicador");
  show("b-actividades");

  autoSave();
}

// 🔥 MOSTRAR BLOQUES
function show(id){
  document.getElementById(id).classList.remove("oculto");
}

// 🔥 SEMANA
function getSemana(){
  const d = new Date();
  const start = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d-start)/86400000)+start.getDay()+1)/7);
  return "Semana " + week;
}

// 🔥 AUTOGUARDADO REAL
let timer;

["semana","indicador","actividades"].forEach(id=>{
  document.getElementById(id).addEventListener("input", autoSave);
});

function autoSave(){

  clearTimeout(timer);

  timer = setTimeout(async ()=>{

    document.getElementById("estado").textContent = "Guardando...";

    await fetch(API,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        accion:"guardarPlaneacion",
        correo:ST.correo,
        materia:ST.materia,
        grado:ST.grado,
        semana:document.getElementById("semana").value,
        indicador:document.getElementById("indicador").value,
        actividades:document.getElementById("actividades").value
      })
    });

    document.getElementById("estado").textContent = "Guardado automáticamente";

  }, 1200);

}

</script>

</body>
</html>
