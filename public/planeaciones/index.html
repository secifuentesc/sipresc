<script>

function obtenerSesion(){

  const data = localStorage.getItem("lp_user");

  if(!data) return null;

  try{
    return JSON.parse(data);
  }catch{
    return null;
  }
}

function obtenerCorreo(){
  const sesion = obtenerSesion();
  return sesion?.correo || null;
}

let ST = {
  materia: null,
  grado: null
};

const API = "/api/planeaciones"; // ⚠️ ajusta si tu ruta es otra

// 🔥 INICIO
window.addEventListener("load", () => {

  const correo = obtenerCorreo();

  if(!correo){
    window.location.href = "/"; // redirige al login
    return;
  }

  ST.correo = correo;

  cargarMaterias();
  cargarBorrador();
});

// 🔥 CARGAR MATERIAS
const CACHE_KEY = "materias_cache_v1";
const CACHE_TIME = "materias_cache_time";
const CACHE_MAX_AGE = 1000 * 60 * 60 * 6; // 6 horas

async function cargarMaterias(){

  const correo = obtenerCorreo();
  const display = document.getElementById("materiaText");

  if(!correo){
    display.textContent = "Sesión no válida";
    return;
  }

  // 🔥 1. INTENTAR CACHE PRIMERO (CARGA INMEDIATA)
  const cache = localStorage.getItem(CACHE_KEY);
  const cacheTime = localStorage.getItem(CACHE_TIME);

  if(cache && cacheTime && (Date.now() - cacheTime < CACHE_MAX_AGE)){
    ST.data = JSON.parse(cache);
    pintarMaterias(ST.data);
    display.textContent = "Seleccionar materia...";
    console.log("Materias desde cache ⚡");
  } else {
    display.textContent = "Cargando...";
  }

  // 🔥 2. ACTUALIZAR DESDE API
  try {

    const res = await fetch(`${API}?accion=cargaDocente&correo=${correo}`);
    const json = await res.json();

    if (json.ok && json.materias) {

      ST.data = json.materias;
      pintarMaterias(json.materias);

      localStorage.setItem(CACHE_KEY, JSON.stringify(json.materias));
      localStorage.setItem(CACHE_TIME, Date.now());

      display.textContent = "Seleccionar materia...";
      console.log("Materias actualizadas 🔄");

    } else {
      display.textContent = "Sin materias";
    }

  } catch (err) {

    console.error(err);

    if(!cache){
      display.textContent = "Error de conexión";
    }

  }
}
  
function pintarMaterias(materias){

  const box = document.getElementById("materiaOptions");
  box.innerHTML = "";

  materias.forEach(m => {

    const div = document.createElement("div");
    div.textContent = m.asignatura;

    div.onclick = () => {
      document.getElementById("materiaText").textContent = m.asignatura;
      ST.materia = m.asignatura;
      box.style.display = "none";
      onMateria();
    };

    box.appendChild(div);
  });
}

// 🔥 CUANDO SELECCIONA MATERIA
function onMateria(){

  const materia = ST.materia;
  if(!materia) return;

  const bloque = document.getElementById("b-grado");

  ocultar("b-semana");
  ocultar("b-planeacion");

  if (!ST.data) {
    console.warn("No hay datos cargados aún");
    return;
  }

  const data = ST.data.find(m => m.asignatura === materia);

  if (!data || !data.grados) {
    bloque.classList.add("oculto");
    return;
  }

  // 🔥 PRIMERO calculamos
  const gradosUnicos = [...new Set(
    data.grados.map(g => g.replace(/\s+[A-B]$/, "").trim())
  )];

  // 🔥 LUEGO pintamos
  const box = document.getElementById("gradoOptions");
  box.innerHTML = "";

  gradosUnicos.forEach(g => {

    const div = document.createElement("div");
    div.textContent = g;

    div.onclick = () => {
      document.getElementById("gradoText").textContent = g;
      ST.grado = g;
      box.style.display = "none";
      onGrado();
    };

    box.appendChild(div);
  });

  activarBloque("b-grado");

  actualizarProgreso();
}

function calcularSemana(){
  const hoy = new Date();
  const inicio = new Date(hoy.getFullYear(), 0, 1);
  const semana = Math.ceil((((hoy - inicio) / 86400000) + inicio.getDay()+1)/7);
  return `Semana ${semana}`;
}

function cargarBorrador(){

  try {

    const data = localStorage.getItem("planeacion_borrador");
    if(!data) return;

    const d = JSON.parse(data);

    if(d.semana){
      const semanaEl = document.getElementById("semanaText");
      if(semanaEl){
        semanaEl.textContent = d.semana;
        ST.semana = d.semana;
      }
    }

    setTimeout(() => {

      if(document.getElementById("indicadorInput")){
        document.getElementById("indicadorInput").value = d.indicador || "";
      }

      for(let i=1;i<=5;i++){
        const tema = document.getElementById("tema_"+i);
        const act = document.getElementById("act_"+i);

        if(tema) tema.value = d["d"+i+"_tema"] || "";
        if(act) act.value = d["d"+i+"_act"] || "";
      }

      if(document.getElementById("compObligatoria")){
        document.getElementById("compObligatoria").value = d.comp_obligatoria || "";
      }

      if(document.getElementById("compAnexo")){
        document.getElementById("compAnexo").value = d.comp_anexo || "";
      }

      if(document.getElementById("famObs")){
        document.getElementById("famObs").value = d.fam_obs || "";
      }

      if(document.getElementById("famAnexo")){
        document.getElementById("famAnexo").value = d.fam_anexo || "";
      }

    }, 800);

  } catch (error){
    console.error("Error cargando borrador:", error);
  }

}




function validarBotonEnviar(){

  const indicador = document.getElementById("indicadorInput")?.value || "";

  let hayContenido = false;

  for(let i = 1; i <= 5; i++){
    const t = document.getElementById("tema_"+i)?.value || "";
    const a = document.getElementById("act_"+i)?.value || "";

    if(t.trim().length > 3 || a.trim().length > 3){
      hayContenido = true;
      break;
    }
  }

  if(indicador.trim().length > 5 && hayContenido){
    document.getElementById("btnEnviar").classList.add("activo");
  } else {
    document.getElementById("btnEnviar").classList.remove("activo");
  }

}

function esIndicadorValido(texto){

  const primeraPalabra = texto.trim().split(/\s+/)[0]?.toLowerCase() || "";

  // Infinitivo: aplicar, resolver, analizar, identificar, comprender...
  const terminaEnInfinitivo = /(ar|er|ir)$/.test(primeraPalabra);

  // Tercera persona básica: el estudiante aplica, analiza, identifica...
  const terceraPersona = /^el estudiante\s+[a-záéíóúñ]+/i.test(texto.trim());

  return terminaEnInfinitivo || terceraPersona;
}

async function revisarIndicadorCoach(){

  const campo = document.getElementById("indicadorInput");
  const box = document.getElementById("coachIndicador");

  if(!campo || !box) return;

  box.innerHTML = "";
  box.style.display = "none";

  const texto = campo.value.trim();

  if(!texto){
    box.style.display = "none";
    box.innerHTML = "";
    return;
  }

  let mensajes = [];

  // 🔹 VALIDACIÓN PEDAGÓGICA
  if(esIndicadorValido(texto)){
    mensajes.push(`<div class="coach-ok">✔ Redacción adecuada (infinitivo o tercera persona).</div>`);
  }else{
    mensajes.push(`<div class="coach-warning">⚠ El indicador debe iniciar con un verbo en infinitivo o en tercera persona.</div>`);
  }

  if(!texto.endsWith(".")){
    mensajes.push(`<div class="coach-warning">⚠ Debe finalizar con punto.</div>`);
  }

  // 🔥 ORTOGRAFÍA REAL
  const errores = await revisarOrtografia(texto);

  if(errores.length > 0){

    mensajes.push(`<div class="coach-error" style="margin-top:8px;"><b>Errores detectados:</b></div>`);

    errores.forEach(e => {

      const sugerencia = e.replacements[0]?.value || "Sin sugerencia";

      const offset = e.offset;
      const length = e.length;

      mensajes.push(`
  <div class="coach-error">
    🔴 "${e.context.text}" → 
    <span class="sugerencia"
  onclick="aplicarCorreccion(${offset}, ${length}, '${sugerencia}', 'indicadorInput')">
  ${sugerencia}
</span>
  </div>
`);

    });

  }else{
    mensajes.push(`<div class="coach-ok">✔ Sin errores ortográficos.</div>`);
  }

  box.style.display = "block";
  box.innerHTML = mensajes.join("");
}

async function revisarOrtografia(texto){

  try{

    const res = await fetch("https://api.languagetool.org/v2/check", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams({
        text: texto,
        language: "es"
      })
    });

    const data = await res.json();

    return data.matches || [];

  }catch(e){
    console.error("Error LanguageTool:", e);
    return [];
  }

}

async function revisarClaseCoach(i){

  const tema = document.getElementById("tema_"+i)?.value.trim() || "";
  const act = document.getElementById("act_"+i)?.value.trim() || "";

  const boxTema = document.getElementById("coachTema_"+i);
  const boxAct = document.getElementById("coachAct_"+i);

  if(!boxTema || !boxAct) return;


  let mensajesTema = [];
  let mensajesAct = [];

  // 🔹 VALIDACIÓN TEMA
  if(tema){

    if(tema.length < 5){
      mensajesTema.push(`<div class="coach-warning">⚠ El tema es muy corto o poco claro.</div>`);
    }

    if(!tema.endsWith(".")){
  mensajesTema.push(`<div class="coach-warning">⚠ El tema debe finalizar con punto.</div>`);
}

    const erroresTema = await revisarOrtografia(tema);

    if(erroresTema.length > 0){

      mensajesTema.push(`<div class="coach-error"><b>Errores en el tema:</b></div>`);

      erroresTema.slice(0,3).forEach(e => {

        const sugerencia = (e.replacements[0]?.value || "").replace(/'/g, "\\'");
        const offset = e.offset;
        const length = e.length;

        mensajesTema.push(`
          <div class="coach-error">
            🔴 "${e.context.text}" → 
            <span class="sugerencia"
              onclick="aplicarCorreccion(${offset}, ${length}, '${sugerencia}', 'tema_${i}')">
              ${sugerencia}
            </span>
          </div>
        `);

      });

    } else {
      mensajesTema.push(`<div class="coach-ok">✔ Tema sin errores.</div>`);
    }

    boxTema.style.display = mensajesTema.length ? "block" : "none";
    boxTema.innerHTML = mensajesTema.join("");

  } else {
    boxTema.style.display = "none";
    boxTema.innerHTML = "";
  }

  // 🔹 VALIDACIÓN ACTIVIDADES
  if(act){

    if(act.length < 10){
      mensajesAct.push(`<div class="coach-warning">⚠ Las actividades deben ser más claras y completas.</div>`);
    }

    if(!/\d+\./.test(act)){
      mensajesAct.push(`<div class="coach-warning">⚠ Organiza en pasos (1., 2., 3.).</div>`);
    }

    if(!act.endsWith(".")){
      mensajesAct.push(`<div class="coach-warning">⚠ Debe finalizar con punto.</div>`);
    }

    let erroresAct = [];
if(act.length > 15){
  erroresAct = await revisarOrtografia(act);
}

    if(erroresAct.length > 0){

      mensajesAct.push(`<div class="coach-error"><b>Errores en actividades:</b></div>`);

      erroresAct.slice(0,3).forEach(e => {

        const sugerencia = (e.replacements[0]?.value || "").replace(/'/g, "\\'");
        const offset = e.offset;
        const length = e.length;

        mensajesAct.push(`
          <div class="coach-error">
            🔴 "${e.context.text}" → 
            <span class="sugerencia"
              onclick="aplicarCorreccion(${offset}, ${length}, '${sugerencia}', 'act_${i}')">
              ${sugerencia}
            </span>
          </div>
        `);

      });

    } else {
      mensajesAct.push(`<div class="coach-ok">✔ Actividades sin errores.</div>`);
    }

    boxAct.style.display = "block";
    boxAct.innerHTML = mensajesAct.join("");

  } else {
    boxAct.style.display = "none";
    boxAct.innerHTML = "";
  }

}

function aplicarCorreccion(offset, length, sugerencia, campoId){

  const campo = document.getElementById(campoId);
  if(!campo) return;

  let texto = campo.value;

  if(offset < 0 || offset > texto.length) return;

  const antes = texto.substring(0, offset);
  const despues = texto.substring(offset + length);

  campo.value = antes + sugerencia + despues;

  campo.focus();
  campo.dispatchEvent(new Event("input"));

// 🔥 FORZAR REVISIÓN INMEDIATA
if(campoId === "indicadorInput"){
  revisarIndicadorCoach();
} else if(campoId.startsWith("tema_") || campoId.startsWith("act_")){
  const i = campoId.split("_")[1];
  revisarClaseCoach(i);
}
}
