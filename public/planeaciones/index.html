<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIPRESC | Planeaciones</title>

<style>
:root{
  --azul:#21145F;
  --azul-claro:#1A428A;
  --amarillo:#FFCC00;
  --bg:#f4f6fb;
}

body{
  margin:0;
  font-family: 'Poppins', Arial;
  background: var(--bg);
}

.header{
  background: var(--azul);
  color:white;
  padding:15px 25px;
  font-weight:600;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.container{
  max-width:900px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

h2{
  margin-top:0;
  color:var(--azul);
}

label{
  font-size:13px;
  color:#555;
}

input, select, textarea{
  width:100%;
  padding:10px;
  margin-top:5px;
  margin-bottom:15px;
  border-radius:8px;
  border:1px solid #ddd;
  font-family:inherit;
}

button{
  background: var(--azul-claro);
  color:white;
  border:none;
  padding:12px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

button:hover{
  opacity:0.9;
}

.badge{
  background:var(--amarillo);
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
}
</style>
</head>

<body>

<div class="header">
  <div>SIPRESC | Planeaciones</div>
  <div class="badge" id="docenteNombre">Cargando...</div>
</div>

<div class="container">

<h2>Nueva planeación</h2>

<label>Asignatura</label>
<select id="asignatura"></select>

<label>Grado</label>
<input type="text" id="grado">

<label>Grupo</label>
<input type="text" id="grupo">

<label>Semana</label>
<input type="text" id="semana">

<label>Indicador</label>
<textarea id="indicador"></textarea>

<label>Clase 1 - Tema</label>
<textarea id="d1tema"></textarea>

<label>Clase 1 - Actividades</label>
<textarea id="d1act"></textarea>

<button onclick="guardar()">Guardar planeación</button>

</div>

<script>

// 🔐 ESTE CORREO DEBE VENIR DEL SISTEMA (LOGIN)
const correoDocente = localStorage.getItem("correo") || "secifuentes@lapresentaciongirardota.edu.co";

// 🔥 CARGA AUTOMÁTICA
window.onload = () => {

  document.getElementById("docenteNombre").innerText = correoDocente;

  fetch(`/api/planeaciones?accion=cargaDocente&correo=${correoDocente}`)
    .then(res => res.json())
    .then(data => {

      const select = document.getElementById("asignatura");

      data.materias.forEach(m => {
        const option = document.createElement("option");
        option.value = m;
        option.textContent = m;
        select.appendChild(option);
      });

    });

}


// 💾 GUARDAR
function guardar(){

  const data = {
    correo: correoDocente,
    asignatura: document.getElementById("asignatura").value,
    grado: document.getElementById("grado").value,
    gruposDestino: document.getElementById("grupo").value,
    semana: document.getElementById("semana").value,

    indicador: document.getElementById("indicador").value,
    d1_tema: document.getElementById("d1tema").value,
    d1_act: document.getElementById("d1act").value
  };

  fetch(`/api/planeaciones`, {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body: JSON.stringify(data)
  })
  .then(res=>res.json())
  .then(res=>{
    if(res.ok){
      alert("Planeación guardada correctamente");
    }else{
      alert(res.mensaje);
    }
  });

}

</script>

</body>
</html>
