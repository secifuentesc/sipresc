<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SIPRESC · Coordinación</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/base.css">
  <style>
:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --border:#e6e8ee;
  --text:#1e1f25;
  --text2:#6b7280;

  --blue:#1A428A;
  --blue-soft:rgba(26,66,138,.08);

  --green:#22c55e;
  --amber:#f59e0b;
  --red:#ef4444;

  --radius:14px;
}

/* BASE */
body{
  background:var(--bg);
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  color:var(--text);
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.title{
  font-size:22px;
  font-weight:600;
}

.subtitle{
  font-size:12px;
  color:var(--text2);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}

.grid-2{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:14px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:0 4px 10px rgba(0,0,0,.03);
}

/* KPI */
.kpi-number{
  font-size:26px;
  font-weight:700;
  color:var(--blue);
}

.kpi-label{
  font-size:11px;
  color:var(--text2);
}

/* ALERT */
.alert{
  border-left:4px solid var(--red);
  padding:10px;
  background:#fff;
  border-radius:8px;
  margin-bottom:8px;
}

/* LIST */
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid var(--border);
}

.row:last-child{
  border:none;
}

/* BADGES */
.badge{
  font-size:10px;
  padding:3px 8px;
  border-radius:10px;
}

.badge.green{background:rgba(34,197,94,.1);color:var(--green);}
.badge.red{background:rgba(239,68,68,.1);color:var(--red);}
.badge.amber{background:rgba(245,158,11,.1);color:var(--amber);}
.badge.blue{background:var(--blue-soft);color:var(--blue);}

/* CALENDAR */
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  margin-top:10px;
}

.day{
  text-align:center;
  padding:8px;
  border-radius:8px;
  font-size:11px;
  cursor:pointer;
}

.day.today{
  background:var(--blue);
  color:#fff;
}

.day.event::after{
  content:'';
  display:block;
  width:4px;
  height:4px;
  background:var(--amber);
  border-radius:50%;
  margin:3px auto 0;
}
</style>
  
</head>
<body>

<<div class="header">
  <div>
    <div class="title">Coordinación</div>
    <div class="subtitle">Resumen semanal SIPRESC</div>
  </div>
</div>

<!-- KPIs -->
<div class="grid">
  <div class="card">
    <div class="kpi-number" id="pln-total">—</div>
    <div class="kpi-label">Planeaciones</div>
  </div>
  <div class="card">
    <div class="kpi-number" id="pln-ap">—</div>
    <div class="kpi-label">Aprobadas</div>
  </div>
  <div class="card">
    <div class="kpi-number" id="pln-pend">—</div>
    <div class="kpi-label">Pendientes</div>
  </div>
  <div class="card">
    <div class="kpi-number" id="citas-hoy">—</div>
    <div class="kpi-label">Citas hoy</div>
  </div>
</div>

<div class="grid-2">

  <!-- IZQUIERDA -->
  <div>

    <!-- ALERTAS -->
    <div class="card">
      <div style="font-weight:600;margin-bottom:10px;">Revisión prioritaria</div>
      <div id="alertas"></div>
    </div>

    <!-- CITAS -->
    <div class="card">
      <div style="font-weight:600;margin-bottom:10px;">Citas del día</div>
      <div id="lista-citas"></div>
    </div>

  </div>

  <!-- DERECHA -->
  <div>

    <!-- CALENDARIO -->
    <div class="card">
      <div style="font-weight:600;">Calendario</div>
      <div class="calendar" id="calendar"></div>
    </div>

    <!-- DOCENTES -->
    <div class="card">
      <div style="font-weight:600;margin-bottom:10px;">Docentes con atención</div>
      <div id="docentes"></div>
    </div>

  </div>

</div>

<script src="/js/core.js"></script>
<script>
function cargarDashboardCoord(){

  // PLANEACIONES
  apiPlaneaciones('planeacionesUI').then(res=>{
    const data = normalizarPlanes(res.data);
    
    const total = data.length;
    const aprobadas = data.filter(p=>p.estadoRevision==='aprobada').length;
    const pendientes = data.filter(p=>!p.estadoRevision || p.estadoRevision==='pendiente').length;

    document.getElementById('pln-total').textContent = total;
    document.getElementById('pln-ap').textContent = aprobadas;
    document.getElementById('pln-pend').textContent = pendientes;

    const alertas = data.filter(p=>p.estadoRevision==='enviada' || p.estadoRevision==='ajustes');

    document.getElementById('alertas').innerHTML =
      alertas.length
      ? alertas.slice(0,5).map(a=>`
        <div class="alert">
          ${a.nombreDocente} · ${a.asignatura}
        </div>
      `).join('')
      : '<div style="font-size:12px;color:#6b7280">Todo al día</div>';
  });

  // CITAS
  api('todasCitas').then(citas=>{
    const hoy = fmtISO(new Date());
    const citasHoy = citas.filter(c=>c.fecha===hoy);

    document.getElementById('citas-hoy').textContent = citasHoy.length;

    document.getElementById('lista-citas').innerHTML =
      citasHoy.length
      ? citasHoy.map(c=>`
        <div class="row">
          <div>${c.padreNombre}</div>
          <span class="badge ${c.estado==='confirmada'?'green':'amber'}">
            ${c.horaInicio}
          </span>
        </div>
      `).join('')
      : 'Sin citas';
  });

  // DOCENTES
  api('docentes').then(docs=>{
    document.getElementById('docentes').innerHTML =
      docs.slice(0,5).map(d=>`
        <div class="row">
          ${d.nombre}
          <span class="badge blue">Activo</span>
        </div>
      `).join('');
  });

  renderCalendar();
}

function renderCalendar(){
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';

  for(let i=1;i<=30;i++){
    const day = document.createElement('div');
    day.className = 'day';
    day.textContent = i;

    if(i === new Date().getDate()){
      day.classList.add('today');
    }

    cal.appendChild(day);
  }
}

document.addEventListener('DOMContentLoaded', cargarDashboardCoord);
</script>
</body>
</html>
